<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0F172A">
    <title>遙控無人機學科測驗系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s;}
        
        /* 深色模式 */
        body.theme-dark { background-color: #0F172A; color: #cbd5e1; }
        body.theme-dark .panel { background-color: #1E293B; border-color: #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        body.theme-dark .explanation-box { background: #1e1b4b; color: #a5b4fc; border: 1px solid #3730a3; }
        body.theme-dark .badge-bg { background-color: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4); color: #a5b4fc; }
        body.theme-dark .wrong-card { background-color: rgba(239, 68, 68, 0.05); border-color: rgba(239, 68, 68, 0.2); }

        /* 護眼模式 (暖黃色) */
        body.theme-warm { background-color: #FCF8E8; color: #3F3E3A; }
        body.theme-warm .panel { background-color: #FFFFFF; border-color: #E6E4DD; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        body.theme-warm .explanation-box { background: #f0f9ff; color: #075985; border: 1px solid #bae6fd; }
        body.theme-warm .badge-bg { background-color: #e0f2fe; border: 1px solid #bae6fd; color: #0369a1; }
        body.theme-warm .wrong-card { background-color: #fef2f2; border-color: #fecaca; }

        /* 明亮模式 (純白色) */
        body.theme-light { background-color: #F1F5F9; color: #334155; }
        body.theme-light .panel { background-color: #FFFFFF; border-color: #E2E8F0; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        body.theme-light .explanation-box { background: #f0f9ff; color: #075985; border: 1px solid #bae6fd; }
        body.theme-light .badge-bg { background-color: #e0e7ff; border: 1px solid #c7d2fe; color: #4338ca; }
        body.theme-light .wrong-card { background-color: #fef2f2; border-color: #fecaca; }

        /* 設定按鈕樣式 */
        .setting-btn-inactive { border: 2px solid transparent; border-radius: 0.75rem; padding: 0.5rem 0; font-weight: 600; text-align: center; transition: all 0.2s; }
        .setting-btn-active { border-radius: 0.75rem; padding: 0.5rem 0; text-align: center; transition: all 0.2s; border: 2px solid #3b82f6 !important; background-color: rgba(59, 130, 246, 0.15) !important; color: #2563eb !important; font-weight: 800 !important; }
        
        body.theme-dark .setting-btn-inactive { border-color: #334155; background-color: transparent; color: #94a3b8; }
        body.theme-dark .setting-btn-active { border-color: #60a5fa !important; background-color: rgba(59, 130, 246, 0.2) !important; color: #60a5fa !important; }
        body.theme-light .setting-btn-inactive, body.theme-warm .setting-btn-inactive { border-color: #cbd5e1; background-color: #f8fafc; color: #64748b; }

        /* 選項按鈕樣式 - 移除雙重間距，調整 padding 達到緊湊滿版效果 */
        .option-btn { width: 100%; text-align: left; border: 2px solid #334155; border-radius: 12px; transition: all 0.2s; background: transparent; color: inherit; }
        body.theme-warm .option-btn, body.theme-light .option-btn { border-color: #cbd5e1; }
        
        /* 解決手機上的 Sticky Hover 殘留亮框問題：只在支援 hover 的設備啟用 */
        @media (hover: hover) and (pointer: fine) {
            .option-btn:hover { border-color: #64748b; }
            body.theme-warm .option-btn:hover, body.theme-light .option-btn:hover { border-color: #94a3b8; }
        }
        
        .option-btn:active { transform: scale(0.98); }
        
        .option-btn.correct { border-color: #22c55e !important; background-color: rgba(34, 197, 94, 0.15) !important; color: #166534 !important; }
        .option-btn.wrong { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.15) !important; color: #991b1b !important; }
        body.theme-dark .option-btn.correct { border-color: #4ade80 !important; color: #4ade80 !important; background-color: rgba(74, 222, 128, 0.1) !important;}
        body.theme-dark .option-btn.wrong { border-color: #f87171 !important; color: #f87171 !important; background-color: rgba(248, 113, 113, 0.1) !important;}
        .option-btn-selected { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.15) !important; color: #2563eb !important; }
        body.theme-dark .option-btn-selected { color: #60a5fa !important; background-color: rgba(59, 130, 246, 0.2) !important; }

        /* 字體大小控制 (優化 Padding 使版面更緊湊) */
        body.font-normal .question-text { font-size: 1.25rem; }
        body.font-large .question-text { font-size: 1.5rem; }
        body.font-xlarge .question-text { font-size: 1.75rem; }
        body.font-normal .option-text { font-size: 1rem; padding: 0.75rem 1rem; }
        body.font-large .option-text { font-size: 1.125rem; padding: 0.85rem 1.25rem; }
        body.font-xlarge .option-text { font-size: 1.25rem; padding: 1rem 1.5rem; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="antialiased theme-dark font-normal">

    <!-- 自訂提示視窗 -->

            <div class="mb-6">

    <div id="app" class="max-w-2xl mx-auto relative z-10 min-h-screen flex flex-col">
        
        <!-- 首頁畫面 -->
        <div id="start-screen" class="panel rounded-none sm:rounded-3xl border-0 sm:border shadow-xl flex-grow flex flex-col p-6 sm:p-8">
            
            <div class="flex justify-between items-center mb-6 mt-2">
                <div class="flex items-center gap-3">
                    <div class="p-3 rounded-full bg-blue-500/20 text-blue-500 text-2xl sm:text-3xl">📖</div>

            <div class="flex bg-slate-500/10 p-1.5 rounded-2xl mb-6 relative border dark:border-slate-700 shadow-inner">

            <div class="grid grid-cols-3 gap-3 mb-6">

                </div>
                <div class="p-3 text-center border border-slate-500/30 rounded-xl bg-slate-500/5 transition-all flex flex-col justify-center items-center">
                    <div id="label-unseen" class="text-xs opacity-70 font-bold mb-1">📦 未作答</div>
                    <div id="stat-unseen" class="text-2xl font-black">324</div>
                </div>
            </div>

            <button id="btn-start-main" class="w-full py-4 rounded-2xl font-bold shadow-lg transition-all flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                <!-- 文案由 JS 動態注入 -->
            </button>
            
            <!-- 歷史易錯題大補帖 -->
            <button id="btn-intensive-quiz" class="hidden w-full bg-purple-600 hover:bg-purple-500 text-white py-4 rounded-2xl font-bold shadow-lg transition-all flex flex-col items-center justify-center cursor-pointer mt-4">
                <div class="text-[17px] flex items-center gap-2">📝 歷史易錯題大補帖 (共 <span id="intensive-count">0</span> 題)</div>
                <div class="text-[13px] font-normal text-purple-200 mt-1.5">針對您曾經錯過的題目進行重點考前衝刺</div>

            <!-- 待加強快速複習 -->
            <button id="btn-quick-review-study" class="hidden w-full bg-orange-500 hover:bg-orange-400 text-white py-4 rounded-2xl font-bold shadow-lg transition-all flex flex-col items-center justify-center cursor-pointer mt-4">
                <div class="text-[17px] flex items-center gap-2">🔥 待加強快速複習 (共 <span id="review-count">0</span> 題)</div>
                <div class="text-[13px] font-normal text-orange-100 mt-1.5">專注閱讀曾答錯的題目，突破盲點</div>
            </button>

            <button id="btn-reset" class="w-full opacity-50 text-[13px] underline mt-6 mb-5 text-center block hover:opacity-100 transition-opacity">🔄 重置進度 (將一切記錄歸零)</button>
            
            <!-- IG 廣告橫幅 (全新現代化滿版設計) -->
            <a href="#" onclick="showModal('即將為您開啟新的分頁前往 Instagram：@chamivision', true, () => window.open('https://www.instagram.com/chamivision/', '_blank')); return false;" class="block mb-2 group relative rounded-2xl overflow-hidden shadow-lg hover:shadow-xl hover:-translate-y-[2px] transition-all duration-300">
                <!-- IG 官方漸層背景 -->
                <div class="absolute inset-0 bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] opacity-90 group-hover:opacity-100 transition-opacity"></div>
                <!-- 內部排版 (完美置中對齊) -->
                <div class="relative px-4 py-4 flex flex-col items-center justify-center">
                    <div class="flex items-center gap-2.5 mb-1">
                        <!-- IG Icon -->
                        <svg class="w-6 h-6 text-white drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                        </svg>
                        <div class="text-[19px] font-black text-white tracking-wide drop-shadow-sm">Follow @ChamiVision</div>
                    </div>
                    <div class="text-[12px] font-bold text-white/90 tracking-widest uppercase drop-shadow-sm">System Design & Technical Support</div>
                </div>
            </a>
        </div>

        <!-- 測驗/題庫畫面 -->
        <div id="quiz-screen" class="hidden panel rounded-none sm:rounded-3xl border-0 sm:border shadow-xl flex-grow flex flex-col p-6 sm:p-8">
            
            <div class="flex justify-between items-center mb-4">
                <div id="quiz-mode-badge" class="badge-bg px-4 py-1.5 rounded-full text-[13px] sm:text-sm font-bold flex items-center gap-1.5 shadow-sm">
                    標籤載入中...
                </div>
                <!-- 齒輪融入標題列右側 -->
                <button class="gear-btn bg-slate-500/10 p-2 rounded-full border shadow-sm hover:bg-slate-500/20 transition-colors flex items-center justify-center h-9 w-9 shrink-0">
                    <span class="text-lg leading-none mt-[-2px]">⚙️</span>
                </button>
            </div>
            
            <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2 mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 2%"></div>
            </div>

            <h2 id="question-text" class="question-text font-bold mb-6 leading-relaxed">題目載入中...</h2>
            <!-- 緊湊排版的選項容器 -->
            <div id="options-container" class="flex flex-col gap-2.5 flex-grow"></div>

            <div id="explanation-container" class="hidden mt-6 p-4 rounded-xl explanation-box text-sm leading-relaxed shadow-inner">
                <div id="explanation-title" class="font-bold mb-1 flex items-center gap-1 text-[15px]">💡 解析：</div>
                <div id="explanation-text" class="text-[15px] mt-1 leading-relaxed">這裡顯示解析...</div>
            </div>

            <!-- 底部按鈕區 -->
            <div class="flex gap-2 mt-6 pt-4 border-t border-slate-500/20 mt-auto pb-2">
                <button id="exit-btn" class="flex-1 bg-slate-500/20 text-current py-4 rounded-xl font-bold hover:bg-slate-500/30 transition-colors text-sm sm:text-[15px] shadow-sm tracking-wide">離開</button>
                <button id="prev-btn" class="hidden flex-1 bg-slate-500/20 text-current py-4 rounded-xl font-bold hover:bg-slate-500/30 transition-colors text-sm sm:text-[15px] shadow-sm tracking-wide">← 上一題</button>
                <button id="next-btn" class="hidden flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold hover:bg-blue-500 transition-colors shadow-md text-sm sm:text-[15px] tracking-wide">下一題 →</button>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="result-screen" class="hidden panel rounded-none sm:rounded-3xl border-0 sm:border shadow-xl text-center flex-grow flex flex-col p-6 sm:p-8">
            <h2 class="text-2xl font-bold mb-2 mt-2" id="result-title">本回合測驗結果</h2>
            <div id="result-badge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-6 border shadow-sm">
                判定中...
            </div>
            
            <p class="opacity-70 mb-2 text-[15px]">本次得分 (依實際作答題數計算)</p>
            <div class="text-[80px] font-black text-blue-500 mb-8 leading-none" id="final-score">0</div>
            
            <div class="bg-slate-500/10 rounded-2xl p-4 mb-6 text-sm flex justify-around shadow-inner">
                <div><span class="block opacity-60 mb-1 font-bold">答對</span><span id="result-correct" class="text-green-500 font-black text-3xl">0</span></div>
                <div><span class="block opacity-60 mb-1 font-bold">答錯</span><span id="result-wrong" class="text-red-500 font-black text-3xl">0</span></div>
            </div>

            <div id="wrong-review-section" class="hidden text-left mt-8">

                    <span class="text-red-500">⚠️</span> 錯題解析與補強 <span class="text-xs opacity-60 font-normal">(已保留於待加強區塊)</span>
                </h3>
                <div id="wrong-answers-list" class="flex flex-col gap-4">

                </div>

            <button id="btn-return-home" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg mt-8 mb-2 hover:bg-blue-500 transition-all mt-auto tracking-wide text-[16px]">回首頁</button>
        </div>

    <!-- 內建 324 題完整題庫 (含原廠解析) -->
    <script>
        const rawDB = [
            "1 下列何者為於遙控無人機飛航活動期間,實際操控遙控無人機並應負飛航安全責任之人員?|(A)遙控無人機操作人。|(B)目視觀察員。|(C)觀察員。|(D)協調員。|0|依據民航法規，於飛航活動期間實際操控並應負飛航安全責任者為「遙控無人機操作人」。",
            "2 下列何者為於延伸視距飛航作業時,持有遙控無人機操作證,並於遙控無人機活動期間,提供實際操控遙控無人機之操作人必要飛航資訊之人員?|(A)遙控無人機操作人。|(B)目視觀察員。|(C)觀察員。|(D)協調員。|1|在延伸視距(EVLOS)飛航時，負責提供飛航資訊給操作人的輔助人員為「目視觀察員」。",
            "3 下列何者為在以「第一人稱視角」(FPV,first-person view)飛行時,於視距範圍內從旁協助操作人觀察四周環境以保障操作安全之人員?|(A)遙控無人機操作人。|(B)目視觀察員。|(C)觀察員。|(D)協調員。|2|FPV飛行時，因操作人視野受限，需由「觀察員」從旁協助觀察四周環境保障安全。",
            "4 下列何者為依政府機關(構)、學校或法人作業手冊之程序,於飛航管制單位提供操作人空域協調資訊之人員?|(A)遙控無人機操作人。|(B)目視觀察員。|(C)觀察員。|(D)協調員。|3|負責與飛航管制單位進行空域協調，並提供資訊給操作人的人員稱為「協調員」。",
            "5 遙控無人機系統包括下列哪些項目?|(A)遙控無人機(機體)、遙控設備。|(B)通訊及控制信號鏈路。|(C)附屬裝置。|(D)以上皆是。|3|無人機系統為一完整體系，包含機體、遙控設備、信號鏈路以及相關的附屬裝置。",

            "123 無人機所用的螺旋槳的型號代表的意義為下列何者?|(A)前兩碼為槳的直徑,後兩碼代表槳的螺距,單位皆為公分。|(B)前兩碼為槳的寬度,後兩碼代表槳的螺距,單位皆為公分。|(C)前兩碼為槳的直徑,後兩碼代表槳的螺距,單位皆為英吋。|(D)前兩碼為槳的寬度,後兩碼代表槳的厚度,單位皆為英吋。|2|槳葉型號(如 1045)前兩碼為「直徑」(10吋)，後兩碼為「螺距」(4.5吋)，單位皆為「英吋」。",

            "125 螺旋槳螺距的意思為下列何者?|(A)想像螺旋槳在某個不能流動的介質中沿螺旋槳軸向旋轉往前,同一片槳葉旋轉一圈所產生螺旋的徑向距離即為螺距。|(B)想像螺旋槳在某個不能流動的介質中沿螺旋槳徑向旋轉往前,同一片槳葉旋轉一圈所產生螺旋的軸向距離即為螺距。|(C)想像螺旋槳在某個不能流動的介質中沿螺旋槳徑向旋轉往前,同一片槳葉旋轉一圈所產生螺旋的徑向距離即為螺距。|(D)想像螺旋槳在某個不能流動的介質中沿螺旋槳軸向旋轉往前,同一片槳葉旋轉一圈所產生螺旋的軸向距離即為螺距。|3|螺距(Pitch)指螺旋槳在不可壓縮介質中，旋轉一圈往前推進的「軸向距離」。",
            "126 螺旋槳的材質為下列何者?|(A)一般為硬質塑膠、碳纖維、及硬質木頭等。|(B)一般為高速鋼、及合金鋼等。|(C)一般為鋁合金、及銅合金等。|(D)以上皆是。|0|為求輕量與強韌，常見材質包含硬質塑膠、碳纖維(Carbon)與硬木。",
            "127 CW、CCW哪個是順時針哪個是逆時針?|(A)CW為逆時針,CCW為順時針。|(B)CW、CCW都是順時針。|(C)CW為順時針,CCW為逆時針。|(D)CW、CCW都是逆時針。|2|CW (Clockwise) 為順時針；CCW (Counter-Clockwise) 為逆時針。",
            "128 電池的測電工具一般有下列何者?|(A)一般有頻譜分析儀、光學尺等。|(B)低電量警報器、分壓測電器及三用電表等。|(C)一般有示波器、電晶體等。|(D)一般有脈衝產生器、功率計等。|1|常用於量測鋰電池的工具為：低電量警報器(BB響)、分壓測電器及三用電表。",
            "129 6s 電池的分壓接頭係由幾條電線構成?|(A)4條線。|(B)5條線。|(C)6條線。|(D)7條線。|3|6S電池代表有6顆電芯串聯。分壓線需要(電芯數+1)條線來量測每一芯的電壓，故為 7 條線。",
            "130 電池並聯時,電壓和電容量為何種變化?|(A)電壓不變,電容量升高。|(B)電壓降低,電容量升高。|(C)電壓升高,電容量降低。|(D)電壓升高,電容量不變。|0|電池「並聯」可增加續航力：總「電壓不變」，但「總電容量相加升高」。",
            "131 無人機的外轉無刷馬達之型號,其代表的意義為下列何者?|(A)前兩碼為馬達轉子繞線線圈的直徑,後兩碼為馬達轉子繞線線圈的高度。|(B)前兩碼為馬達轉子繞線線圈的直徑,後兩碼為馬達定子繞線線圈的高度。|(C)前兩碼為馬達定子繞線線圈的直徑,後兩碼為馬達轉子繞線線圈的高度。|(D)前兩碼為馬達定子繞線線圈的直徑,後兩碼為馬達定子繞線線圈的高度。|3|馬達型號(如2212)前兩碼為內部「定子」的直徑，後兩碼為「定子」的高度。",
            "132 無人機馬達的KV值代表之意義為下列何者?|(A)其單位為kg/V,代表馬達在1V電壓下的離心力。|(B)其單位為rpm/V,代表馬達在1V電壓下的每分鐘轉速。|(C)其單位為C/V,代表馬達在1V電壓下的操作溫度。|(D)其單位為KW/V,代表馬達在1V電壓下的動力輸出。|1|KV值代表電壓每增加 1V 時，馬達「每分鐘增加的空轉轉速 (rpm/V)」。",
            "133 螺旋槳可依下列何者作選配?|(A)不同的KV值。|(B)不同的操作溫度。|(C)不同的離心力。|(D)以上皆是。|0|螺旋槳的大小與螺距，必須嚴格搭配馬達「不同的KV值」來選用，以免燒毀電調。",
            "134 如何選用高速槳或低速槳?|(A)KV值較大者選用低速槳,KV值較小者選用高速槳。|(B)不論KV值大小,選用高速槳就對了。|(C)KV值較大者選用高速槳,KV值較小者選用低速槳。|(D)不論KV值大小,選用低速槳就對了。|2|高KV馬達轉得快，扭力小，適合配小槳(高速槳)；低KV馬達轉得慢但扭力大，適合配大槳(低速槳)。",
            "135 某無人機使用馬達KV值為400,標稱電壓為22.2V,其理論空轉轉速如何計算?|(A)400*√22.2=1,885轉。|(B)400*22.2=8,880轉。|(C)√400*22.22=9,857轉。|(D)400*22.2*75%=6,660轉。|1|理論空載轉速 = KV值 × 電壓。即 400 × 22.2 = 8,880 rpm。",
            "136 有刷馬達的優點為下列何者?|(A)結構簡單、起動扭矩大。|(B)起動及煞車平穩、控制精度高。|(C)購置成本低、維修方便。|(D)以上皆是。|3|有刷馬達擁有結構簡單、啟動扭力大、成本低且維修方便等優點。",
            "137 無刷馬達的優點為下列何者?|(A)無電刷、低干擾。|(B)噪音低、運轉摩擦力小。|(C)壽命長、維護成本低。|(D)以上皆是。|3|無刷馬達因沒有電刷摩擦，具備低干擾、低噪音、效率高且壽命極長的優點。",
            "138 無人機的電子調速器型號是30A,其代表的意義為下列何者?|(A)代表飛控最大允許通過電流大小為30A。|(B)代表電池最大允許通過電流大小為30A。|(C)代表接收機最大允許通過電流大小為30A。|(D)代表電子調速器最大允許通過電流大小為30A。|3|30A 的電調 (ESC)，代表該「電子調速器本身」能承受的最大持續放電電流為 30 安培。",
            "139 PWM (pulse-width modulation,脈波寬度調變)是下列何者?|(A)PWM是將數位訊號轉換為脈波的一種技術。|(B)PWM是將脈波訊號轉換為類比的一種技術。|(C)PWM是將類比訊號轉換為脈波的一種技術。|(D)PWM 是將脈波訊號轉換為數位的一種技術。|2|PWM 是一種透過改變脈波工作週期(Duty Cycle)，將「類比訊號(大小)轉換為數位脈波」來控制馬達轉速的技術。",
            "140 電子調速器損壞後可用下列何者代替?|(A)用更大的或更小的電子調速器代替都可以。|(B)只能用更小的電子調速器代替。|(C)只能用更大的電子調速器代替。|(D)以上皆是。|2|若原本30A燒毀，只能換相同30A或「更大(如40A)」的電調，換更小的一催油門就會燒掉。",
            "141 無人多旋翼機如何達到平穩飛行的目的?|(A)將所有螺旋槳旋轉方向設定相同,依據牛頓第3定律,螺旋槳所產生的反作用力互相抵銷,達到平穩飛行的目的。|(B)將相鄰的螺旋槳旋轉方向設定相反,依據牛頓第3定律,螺旋槳所產生的逆時針反作用力與順時針反作用力互相抵銷,達到平穩飛行的目的。|(C)將所螺旋槳旋轉方向設定相同,依據牛頓第1定律,螺旋槳所產生的反作用力互相抵銷,達到平穩飛行的目的。|(D)將所螺旋槳旋轉方向設定相同,依據牛頓第2定律,螺旋槳所產生的反作用力互相抵銷,達到平穩飛行的目的。|1|多旋翼透過「相鄰馬達旋轉方向相反」，利用牛頓第3定律的反作用力互相抵銷(抗扭矩)，讓機身不自旋。",
            "142 無人多旋翼機如何實現各種動作?|(A)依據牛頓第3定律,以電子調速器調配各個螺旋槳的轉速來實現各種動作。|(B)依據牛頓第2定律,以電子調速器調配各個螺旋槳的轉速來實現各種動作。|(C)依據牛頓第1定律,以電子調速器調配各個螺旋槳的轉速來實現各種動作。|(D)以上皆是。|0|透過電調改變個別馬達的轉速，利用牛頓第3定律產生的不平衡反作用力(推力差)，完成俯仰、偏航等動作。",
            "143 若某六軸無人機使用30A電子調速器,選擇下列何種規格電池合適?|(A)最大放電電流需小於6*30= 180A。|(B)最大放電電流需大於6*30= 180A。|(C)最大放電電流需小於6*√30=33A。|(D)最大放電電流需大於6*√30=33A。|0|考量安全係數，電池最大放電能力(持續電流)不應小於但也不應無限大。原題意以限制系統峰值考量，選(A)。",
            "144 四軸無人機如何前後飛行?(依序將螺旋槳編號為#1、#2、#3、#4、#1、#3順時針旋轉,#2、#4逆時針旋轉)|(A)將螺旋槳#2、#3加速,同時將#1、#4減速,無人機向前飛行;反之則向後飛行。|(B)將螺旋槳#3、#4加速,同時將#1、#2減速,無人機向前飛行;反之則向後飛行。|(C)將螺旋槳#1、#3加速,同時將#2、#4減速,無人機向前飛行;反之則向後飛行。|(D)將所有螺旋槳同時加速,無人機向前飛行;反之則向後飛行。|1|機頭朝前。後方(#3,#4)加速、前方(#1,#2)減速，機尾抬起機頭下壓，推力向後，無人機即「向前飛行」。",
            "145 四軸無人機如何側向飛行?(依序將螺旋槳編號為#1、#2、#3、#4、#1、#3順時針旋轉,#2、#4逆時針旋轉)|(A)將螺旋槳#2、#3加速,同時將#1、#4減速,無人機向左飛行;反之則向右飛行。|(B)將螺旋槳#3、#4加速,同時將#1、#2減速,無人機向左飛行;反之則向右飛行。|(C)將螺旋槳#1、#3加速,同時將#2、#4減速,無人機向左飛行;反之則向右飛行。|(D)將所有螺旋槳同時加速,無人機向左飛行;反之則向右飛行。|0|右側(#2,#3)加速、左側(#1,#4)減速，機身向左傾斜，推力向右，無人機即「向左飛行」。",
            "146 四軸無人機如何原地轉向?(依序將螺旋槳編號為#1、#2、#3、#4、#1、#3順時針旋轉,#2、#4逆時針旋轉)|(A)將螺旋槳#2、#3加速,同時將#1、#4減速,無人機原地逆時針轉向;反之則原地順時針轉向。|(B)將螺旋槳#3、#4加速,同時將#1、#2減速,無人機原地逆時針轉向;反之則原地順時針轉向。|(C)將螺旋槳#1、#3加速,同時將#2、#4減速,無人機原地逆時針轉向;反之則原地順時針轉向。|(D)將所有螺旋槳同時加速,無人機原地逆時針轉向;反之則原地順時針轉向。|2|改變兩組不同旋轉方向馬達的轉速，破壞扭矩平衡。#1,#3(順)加速，產生逆時針反扭矩，故機身「逆時針轉向」。",
            "147 四軸無人機如何垂直升降?(依序將螺旋槳編號為#1、#2、#3、#4、#1、#3順時針旋轉,#2、#4逆時針旋轉)|(A)將螺旋槳#2、#3加速,同時將#1、#4減速,無人機垂直上升;反之則垂直下降。|(B)將螺旋槳#3、#4加速,同時將#1、#2減速,無人機垂直上升;反之則垂直下降。|(C)將螺旋槳#1、#3加速,同時將#2、#4減速,無人機垂直上升;反之則垂直下降。|(D)將所有螺旋槳同時加速,無人機垂直上升;反之則垂直下降。|3|要維持水平垂直升降，必須「將所有螺旋槳同時加速」增加總推力上升；減速則下降。",
            "148 四軸無人機在空中有幾個自由度?|(A)3個自由度。|(B)6個自由度。|(C)4個自由度。|(D)5個自由度。|1|任何飛行器在3D空間中皆有「6個自由度」(上下、前後、左右位移，以及俯仰、滾轉、偏航旋轉)。",
            "149 四軸無人機在空中有下列哪幾種自由度?|(A)上下、前後。|(B)左右,滾轉。|(C)俯仰、偏航。|(D)以上皆是。|3|飛行器的6個自由度包含：空間三軸位移(上下左右前後)與三軸旋轉(俯仰、滾轉、偏航)。",
            "150 無人機以下列何種方式飛行最省電?|(A)極速飛行。|(B)變速飛行。|(C)匀速飛行。|(D)以上皆是。|2|頻繁加減速最耗電，保持穩定平飛的「勻速飛行」能獲得最佳的續航效率。",
            "151 直昇機揮舞運動的定義為何?|(A)槳葉扭轉運動(torsion)。|(B)槳葉上下撲動(flapping)。|(C)槳葉前後擺動動(lead&flag)。|(D)槳葉伸縮運動(tension & compression)。|1|直昇機旋翼在旋轉時，槳葉因升力不均而產生的「上下撲動(flapping)」稱為揮舞運動。",
            "152 直昇機擺振運動的定義為何?|(A)槳葉扭轉運動(torsion)。|(B)槳葉上下撲動(flapping)。|(C)槳葉前後擺動(lead-lag)。|(D)槳葉伸縮運動(tension & compression)。|2|直昇機槳葉在旋轉平面內產生的「前後擺動(lead-lag / drag)」稱為擺振運動。",
            "153 下列哪些為遙控無人機系統於飛行前應做之必要檢查?|(A)地面導控站、遙控器、無人機飛行前檢查及周邊環境及天氣等。|(B)空域管制、組員資源管理及風險管理等。|(C)任務規畫、機場協調及日出日落時間等。|(D)以上皆是。|0|起飛前必須完成系統硬體(導控站/機體)與現場環境(天氣/障礙物)的全面檢視。",
            "154 下列何者不是無人機飛行前地面導控站檢查項目?|(A)GPS衛星數、地面導控站電量。|(B)數傳信號。|(C)告警訊息(羅盤、加速規等)。|(D)遙控動作與無人機匹配性。|3|「遙控動作匹配性」屬於手持遙控器的動態檢查項目，非純地面軟體導控站(GCS)的靜態數據。",
            "155 下列何者不是無人機飛行前遙控器檢查項目?|(A)遙控器電量。|(B)GPS衛星數。|(C)搖桿微調位置合適性(如適用)。|(D)遙控動作與無人機匹配性。|1|「GPS衛星數」主要顯示在無人機本體或地面導控站上，非遙控器本身的硬體檢查重點。",
            "156 下列何者不是無人機飛行前無人機機身(含電池)檢查項目?|(A)微調位置合適性。|(B)螺旋槳和機架完整。|(C)螺絲鎖接緊密、起落架功能正常。|(D)電池電量充足。|0|「搖桿微調」是遙控器的設定，不屬於無人機機身硬體的物理檢查項目。",
            "157 下列何者不是電池使用檢查項目?|(A)合適的電池容量、合適的S數。|(B)安全的電池安裝。|(C)數傳信號。|(D)穩固的連結至系統。|2|「數傳信號」屬於通訊數據鏈路的狀態，與電池硬體安裝檢查無關。",
            "158 下列何者不是無人機飛行前周邊環境檢查項目?|(A)風速與風向、障礙物。|(B)距離、地磁與其他干擾。|(C)避開人口聚集區域。|(D)螺旋槳和機架完整。|3|「螺旋槳和機架完整」屬於機身硬體檢查，而非周邊外在環境的評估項目。",
            "159 無人多旋翼機一般由下列哪些部件組成?|(A)機架、中心板、馬達。|(B)電子調速器、槳葉、飛控。|(C)腳架、電池、遙控器。|(D)以上皆是。|3|多旋翼機是由機架、動力系統(馬達/電調/槳/電池)、飛控大腦與遙控器組合而成的完整系統。",
            "160 下列何種感測器不是用來測量無人機方位、高度和速度?|(A)GPS、羅盤。|(B)氣壓計。|(C)溫度計。|(D)3軸陀螺儀/3軸加速規。|2|「溫度計」無法提供定位導航或姿態資訊(雖然溫度會影響氣壓，但非直接導航感測器)。",
            "161 下列何者不是用來描述無人機的特性?|(A)軸距、重量、抗風能力。|(B)塗裝與價格。|(C)巡航速度與最大速度、升限。|(D)單人操作還是多人協同操作。|1|「塗裝與價格」屬於商業與外觀資訊，與無人機的飛行性能及技術特性無關。",
            "162 最大起飛重量10公斤的無人多旋翼機約可載重幾公斤?|(A)2.5公斤。|(B)2公斤。|(C)1.5公斤。|(D)1公斤。|0|以常見多旋翼設計經驗值，酬載能力約為最大起飛重量的四分之一，故10公斤約可載重 2.5 公斤。",
            "163 GPS天線為何需要天線支架?|(A)增加美觀。|(B)避開人口聚集區域。|(C)防止電磁干擾。|(D)減低風速與風向的影響。|2|架高 GPS 天線可以遠離底層飛控板與馬達大電流產生的「電磁干擾」，確保收訊品質。",
            "164 IMU (inertial measurement unit,慣性量測單元)是用3個軸向的陀螺儀及加速規,來量測無人機的下列何者?|(A)3個軸向的高度及位置。|(B)3個軸向的姿態角及加速度。|(C)3個軸向的姿態角及速度。|(D)3個軸向的高度及加速度。|1|IMU 內部晶片專司負責測量機身的三軸「姿態角(傾斜)」與三軸「加速度(G力)」。",
            "165 陀螺儀(gyroscope)主要由一個位於軸心的轉子構成,依據角動量守恆原理,轉子旋轉時產生的角動量有抗拒方位改變的特性,用此特性來感測和維持下列何者?|(A)方位及角速度。|(B)高度及角速度。|(C)方位及高度。|(D)以上皆是。|0|陀螺儀利用角動量守恆，專門用來感測物體的「方位」變化與「角速度(旋轉快慢)」。",
            "166 加速規(accelerometer)又稱加速度計,利用壓電效應、壓阻效應、或電容式感應等作用原理,來測量下列何者?|(A)高度。|(B)位置。|(C)速度。|(D)加速度。|3|顧名思義，加速規(Accelerometer)的核心功能就是用來測量物體的「加速度」。",
            "167 無人飛機在視距外發生「發電機失效(動力系統正常)」,緊急處置程序之一為下列何者?|(A)切入返航模式。|(B)立即關閉航機所有電力驅動之酬載裝置。|(C)立即關閉航機除第一人稱影像外之非必要酬載設備。|(D)開啟自動避障系統。|2|發電機失效代表靠備用電池硬撐，需「關閉非必要酬載(省電)」，但保留 FPV 影像以利導航返場。",
            "168 無人飛機在視距外發生「發電機失效(動力系統正常)」時,關閉非必要酬載設備之目的下列何者為非?|(A)減緩蓄電池之電力消耗。|(B)將電力留存供伺服舵機使用。|(C)緩解發電機之振動影響航機穩定操作。|(D)將電力留存供飛控電腦等必要裝備使用。|2|關閉設備是為了「省電」，並非為了解決發電機的物理振動問題。",
            "169 無人飛機在視距外發生「引擎或動力失效」,緊急處置程序之一為下列何者?|(A)切入自動駕駛模式。|(B)分析無人機現有高度與飄降距離。|(C)檢查確認地面導控站硬體接線。|(D)開啟慣性導航系統。|1|定翼機動力失效時會變成滑翔機，首要動作是「分析高度與飄降距離」，研判能否滑翔回場。",
            "170 無人飛機在視距外發生「引擎或動力失效」,若高度不足以飄降回本場,則參考下列何者將無人機飛至安全區域迫降?|(A)姿態儀及酬載影像。|(B)壓力高度。|(C)風速風向。|(D)雲幕高及能見度。|0|無法回場時，操作人必須盯著「姿態儀(維持空速)及酬載影像(看地貌)」，選擇無人區進行迫降。",
            "171 無人飛機在視距外發生「引擎或動力失效」,若操作人分析當下高度不足以飄降回本場,下列處置程序何者為非?|(A)參考姿態儀。|(B)參考酬載影像。|(C)帶桿增加航機攻角。|(D)儘速以飄降方式將航機飛至安全區域實施異地迫降。|2|無動力時「帶桿增加攻角」會導致空速急遽下降並引發失速墜毀，是非常危險的錯誤操作。",
            "172 最佳飄降速度定義為下列何者?|(A)無風環境下,無動力之定翼機下降單位高度可定向飛行最大距離之空速。|(B)背風時一定的高度減少下,無動力之定翼機可定向飛行最大距離的速度。|(C)迎風時一定的高度減少下,無動力之定翼機可定向飛行最大距離之速度。|(D)無風環境下,無動力之定翼機下降單位高度可定向飛行最大距離之地速。|0|最佳飄降速度 (Best Glide Speed) 是指無動力時，能用最少的「高度損失」換取「最大水平飛行距離」的表空速。",
            "173 無人飛機在視距內發生「引擎或動力失效」,緊急處置程序之一為下列何者?|(A)儘速以返航模式落地。|(B)檢查確認地面導控站硬體接線。|(C)開啟自動避障系統。|(D)切換至適當之操作模式,及時依現場風向風速妥適調整航向及各操縱面以保持空速及姿態。|3|視距內動力失效，操作人應立刻接手切換手動或姿態模式，調整操縱面以「維持滑翔空速與姿態」避免失速。",
            "174 無人飛機在視距內發生「引擎或動力失效」,緊急處置程序之一為下列何者為非?|(A)立即切入適當之操作模式。|(B)依現場風向風速妥適調整航向以保持空速及姿態。|(C)依現場風向風速妥適調整各操縱面以保持空速及姿態。|(D)依現場風向風速妥適調整航向及各操縱面以保持航機高度。|3|失去動力後不可能「保持高度」，硬拉高度絕對會導致失速。應以犧牲高度來換取空速滑翔。",
            "175 無人直昇機與多旋翼機在視距外發生「引擎或動力失效」,緊急處置程序之一為下列何者?|(A)立即切入自動駕駛模式。|(B)若航機尚存部份動力,應儘速穩定姿態並減緩下降率,以第一人稱方式尋找安全地點實施異地迫降。|(C)若尚存部份控制能力,應儘速大角度迴轉,拉高高度後以穩定姿態返場降落。|(D)檢查確認地面導控站GPS訊號品質。|1|旋翼機無動力無法滑翔，若還剩餘殘存動力，應全力減緩下降率並「找安全地點異地迫降」。",
            "176 無人直昇機與多旋翼機在視距外發生「動力系統失效」之緊急處置程序為下列何者?|(A)開啟自動避障功能。|(B)若不足以返場降落,應避開人、車、物,循備降場或安全平坦處作預防性飄降。|(C)應立即記錄最終定位座標,儘速前往可能之墜落地點查看,視需要通報相關單位處理。|(D)切入返航模式。|2|完全失效代表已墜機，處置要務是「記錄最終座標並前往搜索」，確認有無造成地面傷亡或火災。",
            "177 無人飛機在視距外發生「上傳鏈路失效」,緊急處置程序之一為下列何者?|(A)關閉無人飛機上不必要之電力裝置。|(B)開啟自動避障系統。|(C)飄降回本場。|(D)無人飛機自動或人為切入返航模式。|3|上傳鏈路(遙控訊號)斷線，飛機聽不到指令，應依賴失效保護機制自動觸發「返航模式 (RTH)」。",
            "178 無人機操作模式之「返航模式」(return to home)指的是下列何者?|(A)飛向預先設定之歸航點,並於歸航點自動降落或盤旋/停懸至切出返航模式或油量/電量耗盡。|(B)在切入返航模式當時的位置,盤旋至切出返航模式或油量/電量耗盡。|(C)在切入返航模式當時的位置往東5km,盤旋至切出返航模式或油量/電量耗盡。|(D)在切入返航模式當時的位置往北5km,盤旋至切出返航模式或油量/電量耗盡。|0|返航模式定義：自動飛回「起飛前設定的Home點」，到達後盤旋或自動降落。",
            "179 無人機飛行控制器系統,其上傳鏈路(遙控訊號)之失效保護(Fail Safe)預設值,其觸發動作下列何者為非?|(A)自主飛行。|(B)自動返航。|(C)原地降落。|(D)原地盤旋或懸停。|0|斷訊保護機制(Fail Safe)通常為返航、降落或懸停，絕不會讓飛機無控地繼續「自主飛行(亂飛)」。",
            "180 無人飛機在視距外發生「上傳鏈路失效」,若無法恢復控制鏈路或航機接收端異常,其失效保護機制(Fail Safe)將觸發下列何者?|(A)自主飛行。|(B)自動拉高。|(C)自動降落。|(D)自動返航。|3|遙控訊號中斷的標準 Fail Safe 處置，系統預設會觸發「自動返航 (RTH)」。",
            "181 無人飛機在視距外發生「上傳鏈路失效」,緊急處置程序之一為下列何者?|(A)關閉無人機上不必要之電力裝置。|(B)分析上傳鏈路失效原因為干擾/遮蔽、地面導控站(發射端)異常、或航機(接收端)異常。|(C)開啟自動避障系統。|(D)飄降回本場。|1|斷訊時，副手或操作人應立即檢視數據，分析是地形遮蔽、遙控器沒電、還是機上接收機故障。",
            "182 無人飛機在視距外發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)應立即以地圖介面或酬載影像檢視週遭遮蔽物及干擾源,待航機恢復控制後應立即轉向或爬升脫離。|(C)若干擾/遮蔽狀況持續,應立即切換自動導航模式,繼續飛行。|(D)關閉無人機上不必要之電力裝置。|1|因為無人機會自動返航脫離遮蔽區，一旦恢復連線，應「檢視干擾源並立即轉向或爬升脫離」以防再次斷訊。",
            "183 無人飛機在視距外發生「上傳鏈路失效」,若失效原因為導控站(亦即上傳發射端)異常,則應採取下列何種動作?|(A)檢查確認導控站硬體接線、更換模組、或重新開機,嘗試恢復控制後飛回本場。|(B)關閉無人飛機上不必要之電力裝置。|(C)在歸航點盤旋至油量/電量耗盡。|(D)開啟自動避障系統。|0|確認是地面遙控器問題，應立即「檢查接線或重新開機」，這期間飛機會靠 Fail Safe 自動返航爭取時間。",
            "184 無人直昇機與多旋翼機在視距外發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)應立即以地圖介面或酬載影像檢視週遭遮蔽物及干擾源,待航機恢復控制後應立即轉向或升高脫離。|(C)若干擾/遮蔽狀況持續,應立即切換自動導航模式,繼續飛行。|(D)關閉無人機上不必要之電力裝置。|1|與定翼機處置相同：一旦恢復通訊，立刻操作旋翼機「轉向或升高」徹底遠離干擾區域。",
            "185 無人飛機在視距外發生「上傳鏈路失效」,若失效原因為航機(亦即上傳接收端)異常,則應採取下列何種動作?|(A)關閉無人飛機上不必要之電力裝置。|(B)無人飛機將在歸航點盤旋至油量/電量耗盡。|(C)檢查確認導控站硬體接線、更換模組、或重新開機。|(D)可利用地圖介面、即時飛航資訊及酬載影像,全程監控航機是否正確返回歸航點盤旋或降落。|3|若是機上接收機損壞，人為已無法遙控。只能盯著地面站螢幕，祈禱並「監控飛機靠飛控大腦自動返航降落」。",
            "186 無人飛機在視距內發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)以肉眼檢視週遭潛在遮蔽物及干擾源,待航機恢復控制後應立即轉向或爬升脫離。|(C)關閉無人飛機上不必要之電力裝置。|(D)切換至適當之操作模式,儘速以穩定之滾轉角、俯仰角等飛行姿態落地。|1|視距內代表眼睛看得到，故恢復連線後應直接「以肉眼檢視地形，操作飛機轉向或爬升脫離干擾源」。",
            "187 無人飛機在視距外發生「下傳鏈路失效」,緊急處置程序之一為下列何者?|(A)關閉無人飛機上不必要之電力裝置。|(B)調整俯仰姿態以飄降飛回本場。|(C)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以脫離干擾/遮蔽區域。|(D)開啟自動避障系統。|2|下傳失效代表「地面站畫面黑掉，但遙控器還能控」。應憑記憶與最後畫面，「盲控爬升或轉向脫離盲區」。",
            "188 無人飛機在視距外發生「下傳鏈路失效」,緊急處置程序之一為下列何者?|(A)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行第一人稱操作以脫離干擾/遮蔽區域。|(B)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行推桿操作以建立安全空速。|(C)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以脫離干擾/遮蔽區域。|(D)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以接近干擾/遮蔽區域。|2|畫面中斷時，操作人須冷靜回想地形，並「打舵爬升或轉向脫離地形遮蔽」，爭取恢復訊號。",
            "189 無人飛機在視距外發生「下傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?|(A)應立即切換至適當之操作模式或啟動返航模式。|(B)開啟自動避障系統。|(C)關閉無人機上不必要之電力裝置。|(D)調整俯仰姿態以飄降飛回本場。|0|盲控有高風險，一旦脫離遮蔽恢復畫面後，最安全的做法是「啟動返航模式或切換姿態模式」將飛機召回。",
            "190 無人飛機在視距外發生「下傳鏈路失效」,若失效原因為無人飛機發射端異常,則應採取下列何種動作?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)應立即採取減災飛行決策,嘗試恢復鏈路通訊後以第一人稱方式,儘速控制航機以穩定姿態返場降落。|(C)切換至姿態操作模式,儘速參考酬載影像以第一人稱方式將航機飛回本場。|(D)關閉無人飛機上不必要之電力裝置。|1|確定機上發射機壞掉(畫面永久黑屏)，此時應採取「減災決策(如盲控拉高或按下一鍵返航)」，嘗試讓飛機平安返場。",
            "191 無人飛機在視距外發生「下傳鏈路失效」,若失效原因為地面導控站接收端異常,則應採取下列何種動作?|(A)應立即檢診其電源、天線及硬體線路接頭,必要時可更換模組或重新開機以嘗試恢復鏈路通訊。|(B)應立即採取減災飛行決策,嘗試恢復鏈路通訊後以第一人稱方式,儘速控制航機以穩定姿態返場降落。|(C)切換至姿態操作模式,儘速參考酬載影像以第一人稱方式將航機飛回本場。|(D)關閉無人飛機上不必要之電力裝置。|0|地面站黑屏若是地面設備問題，副手應「立即檢查天線、電源接頭或重開機」，同時正手按返航鈕爭取時間。",
            "192 無人飛機在視距內發生「下傳鏈路失效」,緊急處置程序之一為下列何者?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)應立即切換至適當之操作模式或啟動返航模式,並全程使用第一人稱操作,儘速控制航機以穩定姿態返場降落。|(C)關閉無人飛機上不必要之電力裝置。|(D)應立即切換至適當之操作模式或啟動返航模式,並全程與航機保持目視,儘速控制航機以穩定姿態返場降落。|3|既然在視距內，畫面黑掉也沒關係。操作人應抬頭「與飛機保持肉眼目視」，直接手動將其平穩飛回。",
            "193 無人飛機在視距外發生「下傳鏈路失效」,若超過該機合理滯空時間一直未見航機歸航或飛回本場,代表可能發生下列何種狀況?|(A)可能已在其他適當地點安全降落。|(B)可能仍在發生「下傳鏈路失效」當時的位置盤旋。|(C)可能已在下傳斷訊時失事或返航途中失事。|(D)以上皆非。|2|畫面斷線又過了電池極限時間還沒飛回來，代表飛機極有可能「在斷訊當下或盲目返航途中已經撞山失事」。",
            "194 無人飛機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者?|(A)立即切換至適當之操作模式以停止衛星定位功能介入航機之控制,並由操作人以第一人稱方式接手操作。|(B)調整俯仰姿態以飄降飛回本場。|(C)關閉無人飛機上不必要之電力裝置。|(D)檢查確認導控站硬體接線、更換模組、或重新開機。|0|GPS訊號異常會導致飛控亂算座標引發亂飛，應立即「切換至姿態模式(停止GPS介入)」，改看第一人稱影像手動飛回。",
            "195 無人飛機在視距內發生「衛星定位訊號異常」,緊急處置程序為下列何者?|(A)儘速操控航機轉向或爬升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,並以目視方式控制航機返場降落。|(B)調整俯仰姿態以飄降飛回本場。|(C)關閉無人飛機上不必要之電力裝置。|(D)檢查確認導控站硬體接線、更換模組、或重新開機。|0|視距內遇GPS受干擾，應立刻切手動，「打舵離開橋樑或高樓等遮蔽環境」，用肉眼將飛機飛回。",
            "196 無人直昇機與多旋翼機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者?|(A)儘速操控航機轉向或上升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,待衛星訊號恢復後繼續飛行。|(B)調整俯仰姿態以飄降飛回本場。|(C)關閉無人飛機上不必要之電力裝置。|(D)檢查確認導控站硬體接線、更換模組、或重新開機。|0|切手動並「轉向/爬升脫離會遮蔽衛星的地形」，爭取GPS重新定位。但在視距外需依賴影像畫面輔助。",
            "197 無人直昇機與多旋翼機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者為非?|(A)儘速操控航機轉向或上升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,待衛星訊號恢復後繼續飛行。|(B)操作人參考即時飛航資訊、地圖介面及酬載影像以第一人稱方式接手操作。|(C)立即切換至適當之操作模式以停止衛星定位功能介入航機之控制。|(D)若異常狀況持續無法改正,應儘速以目視方式控制航機返場降落。|3|因為是在「視距外」，操作人根本看不到飛機，不可能「以目視方式」控制降落，這是完全不合理的作法。",
            "198 無人直昇機與多旋翼機在視距內發生「衛星定位訊號異常」,緊急處置程序為下列何者?|(A)立即切換至適當之操作模式以停止衛星定位功能介入航機之控制,並由操作人以目視方式接手操作。|(B)調整俯仰姿態以飄降飛回本場。|(C)關閉無人飛機上不必要之電力裝置。|(D)檢查確認導控站硬體接線、更換模組、或重新開機。|0|GPS異常時飛機會隨風亂飄，視距內應立刻「切姿態模式剝奪GPS權限」，靠操作人硬底子肉眼手排接管。",
            "199 無人飛機在視距內發生「姿態儀異常」,緊急處置程序之一為下列何者?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)切換至適當之操作模式,由操作人目視航機接手操作,穩定飛行姿態後儘速控制航機返場降落。|(C)關閉無人飛機上不必要之電力裝置。|(D)人為切入返航模式。|1|姿態儀異常代表飛控不知道哪邊是水平。操作人應立即切換至全手動模式(Manual)，「完全靠肉眼判定飛機傾角來控制返場」。",
            "200 無人飛機在視距外發生「姿態儀異常」,緊急處置程序之一為下列何者?|(A)若操作人之技能不足以第一人稱方式手動控制航機,應立即採取減災飛行決策,參考姿態儀及時資訊操控航機落地。|(B)若操作人之技能不足以第一人稱方式手動控制航機,應立即採取減災飛行決策,參考酬載影像、即時飛航資訊及地圖介面嘗試將航機飛至人群上空。|(C)若操作人之技能不足以第一人稱方式手動控制航機,應立即採取減災飛行決策,參考酬載影像、即時飛航資訊及地圖介面嘗試將航機飛至安全區域,並儘速實施異地迫降處置。|(D)若操作人之技能不足以第一人稱方式手動控制航機,應立即切換至返航模式,參考酬載影像及地圖介面嘗試將航機飛至安全區域迫降。|2|視距外姿態儀異常極難救援。若無把握飛回，應執行減災決策：「看著影像將飛機飛向無人安全區進行異地墜毀/迫降」。",
            "201 無人直昇機與多旋翼機在視距內發生「姿態儀異常」,緊急處置程序之一為下列何者?|(A)立即切換至適當之操作模式以停止慣性導航儀介入航機之控制。|(B)切換至適當之操作模式,參考酬載影像以第一人稱方式將無人機飛回本場。|(C)立即由操作人目視航機接手操作,建立安全高度後儘速控制航機返場降落。|(D)立即由操作人目視航機接手操作,穩定姿態或原處懸停後儘速控制航機返場降落。|3|旋翼機無姿態儀會立刻翻車，應切至無自穩的純手動模式，由操作人高超技術「強行用肉眼穩住姿態並懸停，隨即降落」。",
            "202 無人直昇機與多旋翼機在視距外發生「姿態儀異常」,緊急處置程序之一為下列何者?|(A)參考酬載影像穩定姿態或原處懸停後操控航機與地形地障保持安全隔離。|(B)立即切換至姿態模式,儘速以穩定之滾轉角、俯仰角穩定將航機飛回本場。|(C)立即切換至姿態模式由操作人接手操作,將航機原處盤旋。|(D)立即切換至適當之操作模式以停止慣性導航儀介入航機之控制。|0|視距外無法用肉眼看平衡，只能靠「看著圖傳影像(FPV)來感受機身歪斜」，強行打舵維持平衡並避開地形。",
            "203 無人直昇機與多旋翼機在視距外發生「姿態儀異常」,緊急處置程序之一為下列何者?|(A)檢查確認導控站硬體接線、更換模組、或重新開機。|(B)切換至姿態操作模式,儘速參考酬載影像以第一人稱方式將航機飛回本場。|(C)立即切換至適當之操作模式以停止姿態儀介入航機之控制,並由操作人接手操作。|(D)人為切入返航模式。|2|姿態儀(IMU)已瘋狂，飛控會給出錯誤指令。必須立刻「切斷姿態儀的控制權限」，完全交由人類接手盲飛。",
            "204 無人飛機在視距外發生「空速管失效」,緊急處置程序為下列何者?|(A)人為切入返航模式。|(B)關閉無人機上不必要之電力裝置。|(C)檢查確認導控站硬體接線、更換模組、或重新開機。|(D)改以導航系統(如衛星定位及慣性導航等)測得之速度及高度參數作為操作之準據。|3|空速管堵塞或結冰時，應立刻「改看 GPS 測出的地速」來做為粗估的空速參考，確保飛機不失速。",
            "205 無人飛機在視距內發生「操縱面致動器/伺服舵機(Servo)失效」,若為單邊控制面(方向舵、副翼、升降舵)失效航機尚存部分可控性,緊急處置程序為下列何者?|(A)立即調整地面導控站位置。|(B)立即切換至姿態模式。|(C)改以導航系統(如衛星定位及慣性導航等)測得之速度及高度參數作為操作之準據。|(D)嘗試利用正常操縱面及差異推力控制(Differential thrust/power)進行配平補償操作以改正航機姿態。|3|單邊舵機卡死時飛機會偏轉，此時只能「打反向舵或利用兩邊馬達推力差」來硬把飛機姿態配平(Trim)穩住。",
            "206 無人飛機在視距外發生「翼面致動器失效」,若為單邊控制面(方向舵、副翼、升降舵)失效航機尚存部分可控性,緊急處置程序為下列何者?|(A)立即以第一人稱方式接手操作,嘗試利用正常操縱面及推力控制進行配平補償操作以改正航機姿態。|(B)開啟自動避障系統。|(C)人為切入返航模式。|(D)切換至適當之操作模式,儘速穩定飛行姿態將航機以目視方式飛回本場。|0|視距外只能看著「第一人稱(FPV)影像」，操作正常的舵面與馬達推力差來強行改正姿態返航。",
            "207 無人飛機在視距外發生「翼面致動器失效」,若為雙邊控制面(方向舵、副翼、升降舵)失效航機已完全喪失可控性,緊急處置程序為下列何者?|(A)啟動自動返航模式。|(B)開啟自動避障系統。|(C)應立即記錄最終定位座標,在人員安全前題下儘速前往可能之墜落地點查看,以確認未引起火災等其他災害。|(D)切換至適當之操作模式,儘速穩定飛行姿態將航機以目視方式飛回本場。|2|雙邊失效代表無可救藥必定墜機。唯一能做的就是「看地面站記下墜毀座標」，趕緊前往現場善後及滅火。",
            "208 無人飛機在視距外發生「空中失速(Stall)」,緊急處置程序為下列何者?|(A)以目視方式操作航機飛至安全區域迫降。|(B)調整俯仰姿態以飄降飛回本場。|(C)切換至適當之操作模式,儘速以穩定之滾轉角、俯仰角等飛行姿態降低無人機飛行攻角,建立安全高度。|(D)立即切換至適當之操作模式由操作人以第一人稱方式接手操作,推桿控制航機姿態降低飛行攻角以建立安全空速。|3|失速的唯一解藥是「降機頭」。操作人應立刻推桿(低頭)，「降低機翼攻角」讓空氣重新流過機翼，藉俯衝換取安全空速。",
            "209 無人飛機在視距內發生「空中失速(Stall)」,緊急處置程序為下列何者?|(A)以第一人稱方式操作航機飛至安全區域迫降。|(B)立即切換至適當之操作模式由操作人目視航機接手操作,推桿控制航機姿態降低飛行攻角以建立安全空速。|(C)切換至適當之操作模式,儘速以穩定之滾轉角、俯仰角等飛行姿態降低無人機飛行攻角,建立安全高度。|(D)調整俯仰姿態以飄降飛回本場。|1|視距內失速時，看著飛機立刻「推桿(降機頭)降低飛行攻角」，待空速恢復產生升力後再緩緩拉平。",
            "210 無人飛機在視距外發生「低油量/電量」,緊急處置程序為下列何者?|(A)切入任務模式,儘速以穩定之滾轉角、俯仰角等飛行姿態將航機飛回本場。|(B)立即關閉航機除酬載影像外之非必要酬載設備以減緩油量/電量之消耗。|(C)立即加大動力以全速飛回本場。|(D)立即關閉航機酬載影像等非必要酬載設備,以減緩油量/電量之消耗。|1|低電量時首重節流，應「關閉耗電的任務設備(如雷達/探照燈)」，但絕不能關閉影像，否則視距外會變成盲飛瞎子。",
            "211 無人直昇機與多旋翼機在視距外發生「低油量/電量」,緊急處置程序為下列何者?|(A)開啟自動避障系統。|(B)立即以第一人稱方式保持全速飛行,儘速安全返場降落。|(C)調整俯仰姿態以飄降飛回本場。|(D)參考姿態儀及酬載影像將航機飛至安全區域迫降。|3|旋翼機沒電等於直接掉下來(無法滑翔)。若電量撐不回起飛點，應立刻看影像「就近尋找安全空地迫降」。",
            "212 無人直昇機與多旋翼機在視距外發生「低油量/電量」,緊急處置程序下列何者為非?|(A)立即關閉航機除酬載影像外之非必要酬載設備以減緩油量/電量之消耗。|(B)減緩油量/電量之消耗,以維持飛控電腦及伺服舵機等必要模組之運作。|(C)減緩油量/電量之消耗,以維持廣播設備及投放伺服機等模組之運作。|(D)立即以第一人稱方式保持勻速飛行,儘速安全返場降落。|2|保命時刻電要留給飛控大腦，不能拿來維持「廣播設備或投放裝置」等非飛安必要的酬載運作。",
            "213 「迫降航線處置」指的是下列何者?|(A)自行判斷當下高度、距離及航線,安全返場降落。|(B)開啟自動避障系統。|(C)機動改變任務航線來繞越或避障。|(D)參考酬載影像避障並迫降於安全處。|0|當飛機發生異常但還能控時，操作人「自行規劃最安全、最短的航線與高度，將飛機駛回機場降落」稱為迫降航線處置。",

            "236 運輸事故調查法所規定之遙控無人機飛航事故,應向下列何者通報?|(A)向民航局通報即可。|(B)向運安會通報即可。|(C)先向民航局通報,再看情形決定是否向運安會通報。|(D)除向民航局通報外,亦應向運安會通報。|3|出大事(如砸傷人)時是雙向通報制：要報給主管機關「民航局」，也要通報調查機關「運安會(TTSB)」。",

            "246 「遙控無人機重大飛航事故調查作業處理規則」規定,下列何者為應通報之事故?|(A)最大起飛重量逾1公斤之遙控無人機遭受實質損害。|(B)最大起飛重量逾25公斤之遙控無人機遭受實質損害。|(C)最大起飛重量逾1公斤之遙控無人機遭受可修復之損壞。|(D)最大起飛重量逾25公斤之遙控無人機遭受可修復之損壞。|1|如果是「沒有砸到人」純粹墜機，強制通報門檻是：大型機(重量「逾 25 公斤」)且「摔到全毀(實質損害)」。",

            "248 「遙控無人機重大飛航事故調查作業處理規則」規定,造成人民生命、財產重大影響者、或毀損超過下列何者為應通報之事故?|(A)新臺幣100萬元者。|(B)新臺幣50萬元者。|(C)新臺幣25萬元者。|(D)新臺幣10萬元者。|1|如果無人機砸壞了別人的車子或屋頂，只要財損估計「超過新臺幣 50 萬元」，即屬須通報的重大事故。",
            "249 「飛航規則」規定,「高度」指下列何者?|(A)自特定基準至空中某平面或某點或某目標物間之水平距離。|(B)自平均海平面至空中某平面或某點或某目標物間之水平距離。|(C)自特定基準至空中某平面或某點或某目標物間之垂直距離。|(D)自平均海平面至空中某平面或某點或某目標物間之垂直距離。|3|航空學上純粹稱「高度 (Altitude)」，預設就是指從「平均海平面」算起的垂直距離。",
            "250 「飛航規則」規定,「實際高度」指下列何者?|(A)自特定基準至空中某平面或某點或某目標物間之水平距離。|(B)自平均海平面至空中某平面或某點或某目標物間之水平距離。|(C)自特定基準至某平面、某點、或某目標物間之垂直距離。|(D)自平均海平面至空中某平面或某點或某目標物間之垂直距離。|2|實際高度 (Height) 的定義，是從飛行器正下方的「特定基準(如地面)」算起的垂直距離。",
            "251 「飛航規則」規定,有人機目視飛航最低實際高度為下列何者?|(A)不得低於距地面或水面500呎。|(B)不得低於距地面或水面400呎。|(C)不得低於距地面或水面300呎。|(D)不得低於距地面或水面200呎。|0|載人客機的「最低」安全高度是 500 呎；無人機的「最高」高度是 400 呎。藉由這 100 呎的緩衝來隔離雙方確保飛安。",
            "252 「指示高度」為由高度表所顯示出來的高度,基準面為下列何者?|(A)標準參考面。|(B)最低雲幕高。|(C)地面或海平面。|(D)高度表壓力調撥值所設定的基準面。|3|飛機儀表板上直接讀出的指示高度(Indicated Altitude)，其零點基準取決於機長「手動旋鈕設定的氣壓調撥值」。",
            "253 「指示高度」壓力調撥值為下列何者?|(A)29.92 in-Hg。|(B)當地之大氣壓力值。|(C)27.92 in-Hg。|(D)「指示高度」沒有壓力調撥值問題。|1|要讓指示高度準確顯示機場海拔，必須將調撥值設定為塔台報給你的「當地當下的大氣壓力值 (QNH)」。",
            "254 「真高度」俗稱海拔高度,為航空器高於下列何者的垂直距離?|(A)地面。|(B)最低雲幕高。|(C)平均海平面。|(D)標準參考面。|2|真高度 (True Altitude) 也就是地理上的精確海拔高度，基準為「平均海平面 (MSL)」。",
            "255 一般在航圖看到的高度,包括機場、地形、或障礙物的標高都是下列何者?|(A)MSL。|(B)AGL。|(C)ASL。|(D)MGL。|0|航空地圖上標示的山峰、鐵塔、機場高度，全部都是使用平均海平面高度「MSL」。",
            "256 「絕對高度」通常是指經由下列何者所顯示出來的高度?|(A)電波/雷達高度表。|(B)GPS。|(C)氣壓高度表。|(D)以上皆是。|0|絕對高度 (Absolute Altitude) 是飛機距離正下方地表的真實距離，必須靠向下打電波的「電波/雷達高度表」測出。",
            "257 「絕對高度」基準為下列何者?|(A)標準參考面。|(B)地面。|(C)最低雲幕高。|(D)海平面。|1|絕對高度因為是測量與下方障礙物的距離，所以它的 0 點基準就是不斷起伏的「地面」。",
            "258 「絕對高度」壓力高度表的壓力調撥值為下列何者?|(A)29.92 in-Hg。|(B)當地之大氣壓力值。|(C)27.92 in-Hg。|(D)「絕對高度」沒有壓力調撥值問題。|3|絕對高度是靠雷達電波測量物理距離，跟空氣壓力無關，所以「沒有壓力調撥值的問題」。",
            "259 「絕對高度」常用下列何者來表示?|(A)MSL。|(B)MGL。|(C)AGL。|(D)ASL。|2|絕對高度代表離地真實高度，英文縮寫為「AGL (Above Ground Level)」。",
            "260 飛機在通過或降落高山地區的空域時,使用下列何種高度比較安全?|(A)指示高度。|(B)絕對高度。|(C)壓力高度。|(D)以上皆是。|1|飛越山區(地形崎嶇)時，氣壓高度表會騙人，使用雷達打地面的「絕對高度 (AGL)」才能確保不會撞山。",
            "261 「壓力高度」基準面為下列何者?|(A)海平面。|(B)最低雲幕高。|(C)標準參考面。|(D)地面。|2|壓力高度的 0 點基準，是氣象學上假定的大氣「標準參考面 (29.92 in-Hg)」。",
            "262 「壓力高度」之壓力調撥值設定為下列何者?|(A)當地之大氣壓力值。|(B)「壓力高度」沒有壓力調撥值問題。|(C)27.92 in-Hg。|(D)29.92 in-Hg。|3|要讀取壓力高度，機師必須將高度表的氣壓窗強制轉到標準大氣值「29.92 in-Hg (或 1013 hPa)」。",
            "263 「壓力高度」用以計算下列何者?|(A)密度高度。|(B)真高度。|(C)真空速及其他性能資料。|(D)以上皆是。|3|壓力高度是一切航空物理計算的基礎，可用來推算密度高度、真高度，以及飛機的真空速等「以上所有性能資料」。",
            "264 「密度高度」為將壓力高度值對下列何者校驗後的高度?|(A)溫度。|(B)濕度。|(C)風速。|(D)氣壓。|0|空氣受熱膨脹，故「密度高度」是將壓力高度加入當下的「溫度」參數進行校驗修正後得出的結果。",
            "265 如果大氣溫度符合國際標準大氣的狀況,密度高度等於下列何者?|(A)指示高度。|(B)真高度。|(C)壓力高度。|(D)絕對高度。|2|若今天氣溫剛剛好等於標準大氣溫度(如海平面15度)，不須做溫度修正，則密度高度會直接等於「壓力高度」。",
            "266 監控密度高度最主要的目的是下列何者?|(A)避開雷雨區或沙塵暴。|(B)正確計算飛機性能值。|(C)提高濃霧時的能見度。|(D)預估逆溫層的形成。|1|密度高度俗稱「飛機感受到的高度」。機師監控它，是為了「正確計算飛機性能」(如起飛滑行距離要多長、引擎推力剩多少)。",
            "267 下列何者為以遙控無人機投擲物件之一例?|(A)投放海釣拋餌。|(B)噴灑農藥。|(C)工程巡檢。|(D)空拍回傳。|0|利用夾爪或釋放裝置將固體物件丟下，例如「投放海釣拋餌」，即屬法規定義的「投擲」行為。",
            "268 下列何者為以遙控無人機噴灑物件之一例?|(A)工程巡檢。|(B)空拍回傳。|(C)投放海釣拋餌。|(D)噴灑農藥。|3|利用幫浦將液體或粉末化為霧狀灑出，例如「噴灑農藥」，即屬法規定義的「噴灑」行為。",
            "269 下列何者為危險物品第一類爆炸物品之一例?|(A)具劇烈爆炸危險性。|(B)具火焰噴出危險性。|(C)具顯著危險性。|(D)以上皆是。|3|第一類危險品涵蓋所有火藥庫等級的特徵，包含劇烈爆炸、火焰噴出、拋射物等「以上皆是」的顯著危險性。",
            "270 危險物品第二類氣體包括下列何者?|(A)單原子氣體、單分子氣體、化合物分子氣體。|(B)理想氣體、非完全氣體、凡得瓦爾氣體。|(C)易燃氣體、非易燃無毒氣體、毒性氣體。|(D)惰性氣體、溫室氣體、費米氣體。|2|航空運輸將危險氣體分為三級：2.1(易燃氣體)、2.2(非易燃無毒的高壓氣體)及 2.3(毒性氣體)。",
            "271 「危險物品空運管理辦法」危險物品之分類基準,係依下列何者之「危險物品航空安全運送技術規範」之規定?|(A)世界衛生組織。|(B)國際民用航空組織。|(C)世界旅遊組織。|(D)聯合國工業發展組織。|1|全球航空界共同遵守的危險品載運天條，是由 ICAO「國際民用航空組織」所制定的。",
            "272 日出及日落時間,依下列何者公布之時間為準?|(A)民用航空局。|(B)觀光局。|(C)中央氣象局。|(D)運輸研究所。|2|無人機夜間禁飛時間的判定基準，一律以「中央氣象局(現改制為氣象署)」每日公布之日出/日落時刻表為準。",
            "273 日出前/日落後,至太陽中心在地平線下6°之時段稱為下列何者?|(A)民用曙光/民用暮光。|(B)天文曙光/天文暮光。|(C)航海曙光/航海暮光。|(D)朝陽/夕陽。|0|太陽剛沉入地平線下 0度到 6度，天空還算明亮，此階段稱為「民用曙光/暮光 (Civil Twilight)」。",
            "274 日出前/日落後,至太陽中心在地平線下6°至12°之時段稱為下列何者?|(A)朝陽/夕陽。|(B)航海曙光/航海暮光。|(C)民用曙光/民用暮光。|(D)天文曙光/天文暮光。|1|太陽落入地平線下 6度到 12度，海平線開始模糊，此階段稱為「航海曙光/暮光 (Nautical Twilight)」。",
            "275 日出前/日落後,至太陽中心在地平線下12°至18°之時段稱為下列何者?|(A)航海曙光/航海暮光。|(B)朝陽/夕陽。|(C)民用曙光/民用暮光。|(D)天文曙光/天文暮光。|3|太陽落入地平線下 12度到 18度，天空幾乎全黑，星星清晰可見，此階段稱為「天文曙光/暮光 (Astronomical Twilight)」。",
            "276 矯正鏡片一般適用於下列何者?|(A)近視、遠視、老花、斜視、散光等。|(B)遠距離觀察物體。|(C)觀察微小的物體。|(D)遮擋陽光、過濾紫外線。|0|法規允許佩戴的「矯正鏡片」，單純是指用來矯正眼睛天生屈光不正(如近視、散光等)的醫療鏡片。",
            "277 矯正鏡片的佩戴方式一般有下列哪兩種?|(A)單片眼鏡、雙片眼鏡兩種。|(B)框架眼鏡、隱形眼鏡兩種。|(C)輕型眼鏡、重型眼鏡兩種。|(D)長效眼鏡、短效眼鏡兩種。|1|矯正鏡片的佩戴方式很直觀，就是一般的「框架眼鏡」與戴在眼球上的「隱形眼鏡」兩種。",
            "278 以目前遙控無人機操作負荷,其控制台及系統非經特殊設計尚無法同時控制幾架遙控無人機?|(A)2架(含)以上。|(B)3架(含)以上。|(C)4架(含)以上。|(D)5架(含)以上。|0|人類注意力有限，法規規定一人一次只能飛一架，嚴禁未經核准的單人同時操作「2架(含)以上」之群飛行為。",
            "279 「民用航空器及公務航空器重大飛航事故調查作業處理規則」規定,應通報下列重大飛航事故之一,為航空器空中接近至下列哪個範圍,須採緊急避讓動作始能防止相撞或危險之情況者?|(A)200呎以內。|(B)400呎以內。|(C)500呎以內。|(D)900呎以內。|2|兩架航空器在空中距離縮小至「500 呎以內 (約150公尺)」，即構成極度危險的「空中接近 (Near Miss)」重大事故。",
            "280 近年來多起客機疑與無人機的碰撞實例,大多發生於下列何種時機?|(A)客機在機場停駐時。|(B)客機在空中平飛過程中。|(C)客機在機場爬升或下降過程中。|(D)客機在空中轉彎過程中。|2|客機只有在起降階段高度才會低於數千呎。故與無人機碰撞的風險，全集中在「機場爬升或下降(進場)過程中」。",
            "281 帶BEC(battery eliminator circuit,去電池電路)功能的電子調速器可對電源電壓進行降壓,並輸出5V電壓以供電至下列何種機載設備?|(A)飛控電腦。|(B)遙控鏈路元件。|(C)伺服舵機。|(D)以上皆是。|3|BEC 模組就像個變壓器，能將大電池的高壓降為 5V，用來供電給所有弱電設備(飛控、接收機、伺服馬達等)。",
            "282 帶BEC(battery eliminator circuit,去電池電路)功能的電子調速器可對電源電壓進行降壓,並輸出5V電壓以供電至各種機載設備,何者除外?|(A)動力馬達。|(B)遙控鏈路元件。|(C)伺服舵機。|(D)飛控電腦。|0|降壓出來的 5V 是給電子儀器吃的。負責飛行的「動力馬達」吃的是電池直供的大電壓高電流，絕對不能接 BEC。",
            "283 經農政機關登記合格之法人且取得民航局能力審查核准之業者,其飛航活動許可時間以多久為限?|(A)6個月。|(B)3個月。|(C)1年。|(D)1個月。|0|一般法人活動許可最長3個月；但為配合農忙特性，農政代噴業者的許可期限放寬為最長「6個月」。",
            "284 經農政機關登記合格之法人且取得民航局能力審查核准之業者,其飛航活動許可以六個月為限,但其可申請操作限制排除項目不包含下列何者?|(A)不得以遙控無人機投擲或噴灑任何物件。|(B)不得裝載依第四十三條第三項公告之危險物品。|(C)不得於日落後至日出前之時間飛航。|(D)不得於人群聚集或室外集會遊行上空活動。|3|農噴業者可申請排除噴灑、危險品(農藥)、夜飛限制。但農地不可能有遊行，故不包含排除「人群聚集上空」之限制。",
            "285 某遙控無人機操作人欲執行農藥噴灑作業,以下敘述何者正確?|(A)執行業務之活動申請者須為經農政機關登記合格之法人。|(B)其飛航活動許可時間以3個月為限。|(C)應於活動日三十日前提出申請。|(D)該操作人不須通過術科測驗。|0|農藥噴灑高度危險，法規明定自然人不得進行，必須由「經農政機關登記合格的合法法人」提出活動申請。",
            "286 某遙控無人機操作人欲執行農藥噴灑作業,以下敘述何者正確?|(A)執行業務之活動申請者須為經農政機關登記合格之法人。|(B)其飛航活動許可時間以6個月為限。|(C)應於活動日十五日前提出申請。|(D)以上皆是。|3|農噴三要件：(A)須為農政合格法人、(B)許可期最長可達 6 個月、(C)需於 15 天前提出申請。故以上皆是。",
            "287 經農政機關登記合格之法人欲於禁、限航區及航空站或飛行場四周一定距離範圍內從事農藥噴灑作業,應於活動日前多久提出申請?|(A)30日前。|(B)15日前。|(C)3日前。|(D)5日前。|1|雖然是農政法人，但只要想闖入紅/黃區(禁限航區或機場四周)，依常規程序皆須於「15 日前」提出申請。",
            "288 於直轄市、縣(市)政府公告之禁止、限制區域內從事遙控無人機農藥噴灑作業時,如有跨縣市飛航情形,應向哪個機關提出申請?|(A)飛經之直轄市、縣(市)政府。|(B)向起飛地點所在直轄市、縣(市)政府提出申請,經所在地及跨縣市政府同意。|(C)降落地點所在直轄市、縣(市)政府。|(D)降落地點所鄰近直轄市、縣(市)政府。|1|遇到跨縣市的農噴任務，單一窗口原則：向「起飛點縣市政府」送件，由其代為協調沿途跨越之縣市共同同意。",
            "289 經農政機關登記合格之法人因執行農噴業務需於直轄市、縣(市)政府所公告之遙控無人機活動區域、時間及其他管理事項外從事飛航活動者,應申請何者會商相關中央主管機關同意後,始得為之?|(A)直轄市、縣(市)政府。|(B)衛福部。|(C)農委會。|(D)交通部。|0|若要在地方政府管轄的紅/黃區進行農噴，必須申請該管轄的「直轄市、縣(市)政府」會商中央後同意。",
            "290 經農政機關登記合格之法人因執行農噴業務需於禁、限航區及航空站或飛行場四周一定距離範圍內從事遙控無人機飛航活動者,應申請何者會商目的事業主管機關同意後,始得為之?|(A)鄉鎮區公所。|(B)農委會。|(C)民航局。|(D)直轄市、縣(市)政府。|2|禁限航區及機場四周(中央管制區)權限極高，必須直接向最高民航主管機關「民航局」提出申請會商。",
            "291 政府機關(構)、學校或法人於直轄市、縣(市)政府公告之禁止、限制區域內從事遙控無人機飛航活動,應取得相關中央主管機關同意,有關該程序下列敘述何者正確?|(A)應報請直轄市、縣(市)政府會商相關中央主管機關同意。|(B)相關中央主管機關得委託政府機關(構)或團體代為同意。|(C)相關中央主管機關委託相關業務應將委託之對象、事項及法規依據公告之,並刊登於政府公報。|(D)以上皆是。|3|法規明定地方審查程序：報請地方政府會商中央，中央可依法公告委託專責團體代為行使同意權。",
            "292 遙控無人機製造者或進口者利用電子商務服務系統販售遙控無人機時,應將下列哪段文字標示於電子商務服務系統明顯處?|(A)最大起飛重量二百五十公克以上遙控無人機應辦理註冊。|(B)遙控無人機活動前應注意活動區域與遵守操作規定。|(C)相關活動區域及操作規定資訊,請見民航局網站及遙控無人機圖資行動應用程式。|(D)以上皆是。|3|為防制無知違法，電商網購平台頁面必須明顯標示：250g需註冊、注意空域、並附上民航局圖資App的宣導文字。",
            "293 利用電子商務服務系統販售遙控無人機時販售遙控無人機前,應由下列何者向民航局申請辦理產品資訊登錄?|(A)代理商。|(B)製造商。|(C)進口者。|(D)以上皆是。|3|不論你是源頭的製造商，還是引進水貨的進口者/代理商，只要負責「販售源頭」，都有義務向民航局辦理產品登錄。",
            "294 遙控無人機於販售或進口前,應由下列何者於產品或包裝上標示最大起飛重量、註冊程序、型式檢驗標籤或認可標籤、實體檢驗說明、操作限制說明、管理及違規裁罰等資訊?|(A)代理商。|(B)製造商。|(C)進口者。|(D)以上皆是。|3|如同食品標示成分，上述代理商、製造商、進口者，皆有法定義務在「外包裝」上貼滿重量與裁罰等警語資訊。",
            "295 學習操作證持有人得於持有遙控無人機普通操作證或專業操作證之操作人在旁指導下,依其操作證所載之構造分類,學習操作最大起飛重量未達多少公斤之遙控無人機?|(A)15公斤。|(B)25公斤。|(C)2公斤。|(D)150公斤。|1|法規對於新手學習的重量寬容度上限是「未達 25 公斤」之機型(需教練在旁)。",
            "296 學習操作證持有人得於持有遙控無人機普通操作證之操作人在旁指導下,學習操作最大起飛重量未逾多少公斤之遙控無人機?|(A)15公斤。|(B)25公斤。|(C)2公斤。|(D)150公斤。|0|注意陷阱！教練如果是拿「普通證」，因普通證自身最高只能飛未達15公斤，故指導學習也「不得逾 15 公斤」。",
            "297 學習操作證持有人得於持有遙控無人機專業操作證之操作人在旁指導下,學習操作最大起飛重量未達多少公斤之同一構造遙控無人機?|(A)2公斤。|(B)15公斤。|(C)150公斤。|(D)依指導人持有之專業操作證可操作之重量級別而定,並以最大起飛重量未達25公斤為限。|3|專業教練能教多重，取決於教練自己證照的級別。但無論教練多強，學習證的法定總天花板仍為「未達 25 公斤」。",
            "298 領有最大起飛重量一百五十公斤以上之專業操作證者,對持有學習操作證者具備同一構造最大起飛重量多少公斤的遙控無人機教學資格?|(A)未達2公斤且同一級別以下之遙控無人機資格。|(B)未達15公斤且同一級別以下之遙控無人機資格。|(C)未達25公斤且同一級別以下之遙控無人機資格。|(D)未達150公斤且同一級別以下之遙控無人機資格。|2|（同前題考點）教練雖然能飛 150 公斤巨無霸，但徒弟拿的是學習證，法規上限卡死就是只能教「未達 25 公斤」。",
            "299 操作最大起飛重量一百五十公斤以上之遙控無人機操作人應依下列哪種標準辦理體格檢查?|(A)航空人員乙類體格檢查標準。|(B)普通小型車體檢認定標準。|(C)普通大貨車體檢認定標準。|(D)普通聯結車體檢認定標準。|0|150公斤以上的巨型無人機風險等同輕航機，駕駛員必須接受最嚴格的「航空人員乙類 (機師等級) 體檢標準」。",
            "300 操作最大起飛重量一百五十公斤以下之遙控無人機操作人應依下列哪種標準辦理體格檢查?|(A)航空人員乙類體格檢查標準。|(B)普通小型車體檢認定標準。|(C)普通大貨車體檢認定標準。|(D)無人駕駛航空器體檢認定標準。|1|150公斤以下的操作人，體檢標準較為親民，只要符合考汽車駕照的「普通小型車體檢認定標準」即可過關。",
            "301 有關申請遙控無人機專業操作證者,下列何者有誤?|(A)申請專業基本級II操作證者,應領有專業基本級I(無註記重量限制)操作證一個月以上之經歷。|(B)申請專業高級Ib操作證者,應領有專業高級Ia(無註記重量限制)操作證一個月以上之經歷。|(C)申請專業高級 IIc操作證者,應領有專業基本級II操作證或專業高級Ib操作證均有三個月以上之經歷。|(D)申請專業基本級 操作證者,應領有遙控無人機普通操作證一個月以上之經歷。|3|專業基本證是報考門檻最低的專業證照，法規「並未規定必須先擁有普通操作證的經歷」，故 D 選項為錯誤敘述。",
            "302 申請專業基本級II操作證者,應領有專業基本級I(無註記重量限制)操作證幾個月以上之經歷?|(A)1個月。|(B)2個月。|(C)3個月。|(D)6個月。|0|考取基本級 I 之後，必須累積「1 個月」的飛行經歷，才能向上報考基本級 II。",
            "303 申請專業高級Ib操作證者,應領有專業高級Ia(無註記重量限制)操作證幾個月以上之經歷?|(A)1個月。|(B)2個月。|(C)3個月。|(D)6個月。|0|同理，在高級證照內部晉升 (從 Ia 升至 Ib)，法規要求的磨練經歷同樣為「1 個月」。",
            "304 申請專業高級IIc操作證者,應領有專業基本級II操作證或專業高級Ib操作證幾個月以上之經歷?|(A)1個月。|(B)2個月。|(C)3個月。|(D)6個月。|2|跨入高級 IIc 這個門檻極高的等級，必須具備前階段證書「3 個月」以上之資深經歷。",
            "305 申請專業高級IIId操作證者,應領有下列何種操作證一個月以上之經歷?|(A)專業基本級 III操作證。|(B)專業高級 IIc操作證。|(C)專業基本級II操作證。|(D)專業高級 Ib操作證。|0|報考直昇機頂級的「高級 IIId」，其前置門檻必須先取得同屬 III 系列的「專業基本級 III」操作證 1 個月經歷。",
            "306 申請專業高級IIId操作證者,應領有專業基本級III操作證幾個月以上之經歷?|(A)1個月。|(B)2個月。|(C)3個月。|(D)6個月。|0|（承前題）由基本級 III 跨考高級 IIId，經歷時間門檻為「1 個月」。",
            "307 有關申請遙控無人機專業操作證者之體格檢查規定,下列敘述何者有誤?|(A)操作最大起飛重量一百五十公斤以下之遙控無人機操作人應依據普通小型車體檢認定標準辦理體格檢查。|(B)應向公路監理機關指定之醫療院所或教學醫院辦理體格檢查。|(C)操作最大起飛重量一百五十公斤以上之遙控無人機操作人應依航空人員乙類體格檢查標準辦理體格檢查。|(D)操作最大起飛重量二十五公斤以上之遙控無人機操作人應依航空人員乙類體格檢查標準辦理體格檢查。|3|法規是以「150 公斤」為分水嶺，並非 25 公斤。25公斤至150公斤之間依然只須汽車體檢即可，故 D 敘述錯誤。",
            "308 針對學習操作證之敘述,下列敘述何者為非?|(A)申請者應年滿14歲。|(B)持有者須於具備普通或專業操作證之操作人在旁指導監護下,使得操作。|(C)持有者所操作學習遙控無人機最大起飛重量不得逾15公斤。|(D)持有者所操作學習遙控無人機最大起飛重量不得逾25公斤。|2|學習證在合格教練陪同下，最高可操作至「未達 25 公斤」(即不得逾 25)。敘述 C 限制在 15 公斤是錯誤的。",
            "309 經農政機關登記合格之法人且取得民航局能力審查核准之業者,從事下列哪種飛航活動其同意文件以六個月為限?|(A)以遙控無人機投擲或噴灑任何物件。|(B)裝載依第四十三條第三項公告之危險物品。|(C)於日落後至日出前之時間飛航。|(D)以上皆是。|3|合格農噴法人，可一次申請排除噴灑限制、裝載危險品(農藥)限制，以及夜飛限制。效期均放寬為「6 個月」。",
            "310 有關申請遙控無人飛機專業基本級I操作證者,下列敘述何者為正確?|(A)遙控無人飛機之矩形機翼、翼展僅限介於一百八十公分至二百公分者。|(B)遙控無人飛機之翼弦長僅限介於二十八公分至三十三公分者。|(C)遙控無人飛機之起飛重量僅限大於6.5公斤以上者。|(D)可使用符合Ib規格之工作機任務機。|3|官方測驗用機規範：為了彈性，報考基本級 I 者，可以「向下相容」借用符合高級 Ib 規格的任務機來應考。",
            "311 有關申請遙控無人直昇機專業基本級I操作證者,下列敘述何者為正確?|(A)遙控無人直昇機之旋翼半徑僅限介於七十公分至九十公分者。|(B)遙控無人直昇機之起飛重量僅限大於4.5公斤以上者。|(C)遙控無人直昇機之起飛重量僅限大於6.5公斤以上者。|(D)可使用符合Ib規格之工作機(任務機)。|3|直昇機測驗同理，為方便考生準備應考機，基本級 I 允許使用符合高級 Ib 規格之工作機作為替代方案。",
            "312 有關申請遙控無人多旋翼機專業基本級I操作證者,下列敘述何者為正確?|(A)遙控無人多旋翼機之對角馬達之軸心距離僅限介於九十公分至一百一十公分者。|(B)遙控無人多旋翼機之起飛重量僅限大於4公斤以上者。|(C)遙控無人多旋翼機之起飛重量僅限大於6.5公斤以上者。|(D)可使用符合Ib規格之工作機(任務機)。|3|多旋翼測驗同理，法規開放基本級 I 考生，可直接使用符合高級 Ib 規格的六軸/八軸任務機進行考試。",
            "313 有關申請遙控無人多旋翼機專業基本級I操作證者,下列敘述何者為非?|(A)可使用遙控無人多旋翼機之對角馬達之軸心距離介於九十公分至一百一十公分者。|(B)可使用遙控無人多旋翼機之起飛重量大於或等於4公斤以上者。|(C)可使用遙控無人多旋翼機之起飛重量大於6.5公斤以上者。|(D)可使用符合Ib規格之工作機(任務機)。|2|基本級 I 測驗機規範重量為「大於等於 4 公斤」。要求必須「大於 6.5 公斤」是錯誤且超綱的描述。",
            "314 持有普通操作證者在旁指導持有學習操作證者學習操作遙控無人機,下列敘述何者正確?|(A)可學習操作最大起飛重量未達15公斤之遙控無人機。|(B)可學習操作最大起飛重量未達25公斤之遙控無人機。|(C)可學習操作最大起飛重量未達150公斤之遙控無人機。|(D)可學習操作最大起飛重量150公斤以上之遙控無人機。|0|徒弟能飛多重取決於師父。師父只拿普通證 (上限 15 公斤)，故徒弟最高也只能飛「未達 15 公斤」的飛機。",
            "315 依遙控無人機管理規則規定,遙控無人機製造者或進口者於販售前,應於何處標示最大起飛重量、註冊程序、型式檢驗標籤或認可標籤、實體檢驗說明、操作限制說明、管理及違規裁罰等資訊?|(A)廣告內容。|(B)電子商務服務系統。|(C)產品或包裝上。|(D)以上皆是。|2|實體防漏法規：上述密密麻麻的法定警語及檢驗標籤，廠商必須白紙黑字標示在實體的「產品或包裝上」。",
            "316 自行製造、使用之遙控無人機,應由下列何者向民航局申請辦理產品資訊登錄?|(A)所有人。|(B)零件製造商。|(C)零件供應商。|(D)以上皆是。|0|DIY 自組機沒有進口商背書，法規明定此類機體的註冊與登錄義務，完全由造出來要飛的「所有人」自行承擔。",
            "317 政府機關為執行業務者,其活動申請同意期限為多久?|(A)3個月。|(B)6個月。|(C)1個月。|(D)1年。|3|為確保公權力運行順暢，公務機關(政府/警消)申請飛航活動的同意期限最長，可達「 1 年」。",
            "318 小陳是一位持有專業操作證(G2)的自然人,請問下列敘述何者為有誤?|(A)其操作證得以申請執行遙控無人機投擲或噴灑任何物件。|(B)小陳如欲執行夜間噴灑作業,須再參加第1組(G1)高級術科測驗並取得專業操作證。|(C)小陳如欲執行業務之活動申請,則須透過經農政機關登記合格之法人。|(D)小陳已經擁有專業操作證(G2),即可在屬於綠區的自家農地執行遙控無人機噴灑作業。|3|陷阱題！即使考到最高級證照，只要是「自然人」身分，依法就絕對「禁止投擲或噴灑」，綠區也不行。必須靠行法人。",
            "319 小陳是一間農噴無人機公司的操作人,該公司並已向民航局完成活動申請得以執行農藥噴灑作業,請問下列敘述何者為有誤?|(A)其活動申請同意文件最長得以6個月為限。|(B)該公司是農政機關登記合格之法人。|(C)該公司之能力審查申請,核准效期為1年。|(D)小陳應於每次活動前、後於指定時間內至民航局指定資訊系統登錄飛航資訊。|2|法規更新細節：法人向民航局申請的「能力審查核准 (作業手冊審查)」，其有效期限為「2 年」而非 1 年。",
            "320 小華想要進口一些遙控無人機到網路上販售,請問下列敘述何者為有誤?|(A)小華應主োট動向民航局申請辦理產品資訊登錄。|(B)小華是進口者。|(C)小華不得擅自進口製造商未向民航局完成登錄之遙控無人機。|(D)小華應於販售頁面明顯處標示遙控無人機註冊、操作注意事項及活動空域圖資等資訊。|2|法規未禁止「進口」未登錄機，而是禁止「販售」前未登錄。小華身為進口者，自己就有義務主動幫水貨申請登錄，故C錯。",

            "323 小華是一名持有專業操作證(G3)的警員,因為公務需要,長官請他使用遙控無人機值勤,請問下列敘述何者錯誤?|(A)小華值勤的機關須通過民航局能力審查後始得從事遙控無人機活動。|(B)小華執勤的機關,其活動申請同意文件以半年為限。|(C)經民航局活動申請許可,小華得以於集會遊行上空進行拍攝偵查。|(D)小華未持有專業操作證(G1)證照,日落後即不得操作遙控無人機。|1|小華身為警員代表政府機關執行公務，其飛航活動的同意文件效期最長可給予「1 年」，而非半年。",
            "324 小黃已申請並經許可於桃園機場禁止無人機活動範圍內從事飛航活動,該申請人於執行飛航作業時之應注意事項,請問下列敘述何者正確?|(A)小黃僅須通過民航局能力審查後即可從事遙控無人機活動。|(B)小黃若未取得飛航公告(NOTAM)或未與桃園機場航務組進行協調聯繫,仍視同程序已完備,可依活動許可時間及範圍直接升空作業。|(C)經民航局活動申請許可,小黃即可於桃園機場附近進行空拍作業。|(D)小黃應依「活動同意文件」規定辦理空域協調事宜,作業前後若未與桃園機場航務組進行空域協調聯繫者,視同程序未完成,將依遙控無人機管理規則查處。|3|進入機場紅區生死攸關。即使有公文核准，只要未與塔台(航務組)進行「即時的雷達空域協調」，就絕對不准起飛，違者重罰。"
        ];

        const questionBank = rawDB.map((row, index) => {
            const parts = row.split('|');
            const ansIndex = parseInt(parts[5]);
            return {
                id: index,
                question: parts[0].substring(parts[0].indexOf(' ') + 1),
                options: [parts[1], parts[2], parts[3], parts[4]],
                answer: ansIndex,
                explanation: parts[6] 
            };
        });

        const totalQuestions = questionBank.length;
        
        let isStudyMode = false; 
        let isQuizRunning = false;
        let currentSessionType = ''; 
        let quizQueue = []; 
        let currentQuizIndex = 0;
        let currentQuestionId = -1;
        
        let scoreCorrect = 0;
        let scoreWrong = 0;
        
        let examRecords = []; 
        
        let quizMasteredIds = [], quizWrongIds = [];
        let studyMasteredIds = [], studyWrongIds = [];
        let studyProgressIndex = 0;

        window.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            loadSettings();
            
            document.querySelectorAll('.gear-btn').forEach(btn => btn.onclick = toggleSettings);
            document.getElementById('close-settings-btn').onclick = toggleSettings;
            document.getElementById('close-settings-btn-bottom').onclick = toggleSettings;
            
            document.getElementById('toggle-exam').onclick = () => selectMode(false);
            document.getElementById('toggle-study').onclick = () => selectMode(true);
            
            document.getElementById('btn-start-main').onclick = () => {
                if (!isStudyMode && quizMasteredIds.length >= totalQuestions) {
                    resetProgress(false);
                } else {
                    startSession(isStudyMode ? 'normal_study' : 'normal_quiz');
                }
            };
            document.getElementById('btn-intensive-quiz').onclick = () => startSession('intensive_quiz');
            document.getElementById('btn-quick-review-study').onclick = () => startSession('review_study');
            
            document.getElementById('next-btn').onclick = nextQuestion;
            document.getElementById('prev-btn').onclick = prevQuestion;
            document.getElementById('exit-btn').onclick = exitMode;
            document.getElementById('btn-return-home').onclick = returnToHome;
            document.getElementById('btn-reset').onclick = () => resetProgress(isStudyMode);
            
            ['dark', 'warm', 'light'].forEach(t => {
                document.getElementById(`theme-${t}`).onclick = () => setTheme(t);
            });
            ['normal', 'large', 'xlarge'].forEach(s => {
                document.getElementById(`font-${s}`).onclick = () => setFontSize(s);
            });
        });

        function showModal(message, isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-message').innerText = message;
            
            const btnCancel = document.getElementById('modal-cancel');
            const btnConfirm = document.getElementById('modal-confirm');

            if(isConfirm) {
                btnCancel.classList.remove('hidden');
                btnConfirm.innerText = '確定';
            } else {
                btnCancel.classList.add('hidden');
                btnConfirm.innerText = '我知道了';
            }

            const closeModal = () => {
                modal.classList.add('opacity-0');
                modal.children[0].classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            };

            btnConfirm.onclick = () => { closeModal(); if (onConfirm) onConfirm(); };
            btnCancel.onclick = closeModal;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.children[0].classList.remove('scale-95');
            }, 10);
        }

        function selectMode(isStudy) {
            if (isQuizRunning) return; 
            isStudyMode = isStudy;
            updateDashboard();
        }

        function loadProgress() {
            quizMasteredIds = JSON.parse(localStorage.getItem('drone_quiz_mastered') || '[]');
            quizWrongIds = JSON.parse(localStorage.getItem('drone_quiz_wrong') || '[]');
            studyMasteredIds = JSON.parse(localStorage.getItem('drone_study_mastered') || '[]');
            studyWrongIds = JSON.parse(localStorage.getItem('drone_study_wrong') || '[]');
            studyProgressIndex = parseInt(localStorage.getItem('drone_study_index') || '0');
            
            if (studyProgressIndex >= totalQuestions) studyProgressIndex = 0;
            updateDashboard();
        }

        function updateQuestionStatus(qId, isCorrect, sessionType) {
            let mIds = sessionType.includes('study') ? studyMasteredIds : quizMasteredIds;
            let wIds = sessionType.includes('study') ? studyWrongIds : quizWrongIds;

            if (isCorrect) {
                // 如果答對，且原本不在錯題本(wIds)內，才加進精通區(mIds)
                // 這樣可以保證「錯過一次的題目」就算後來答對，也永遠待在錯題本，直到手動重置。
                if (!wIds.includes(qId) && !mIds.includes(qId)) {
                    mIds.push(qId);
                }
            } else {
                // 如果答錯，確保加入錯題本
                if (!wIds.includes(qId)) {
                    wIds.push(qId);
                }
                // 同時從精通區移除
                if (mIds.includes(qId)) {
                    mIds.splice(mIds.indexOf(qId), 1);
                }
            }

            if (sessionType.includes('study')) {
                localStorage.setItem('drone_study_mastered', JSON.stringify(studyMasteredIds));
                localStorage.setItem('drone_study_wrong', JSON.stringify(studyWrongIds));
            } else {
                localStorage.setItem('drone_quiz_mastered', JSON.stringify(quizMasteredIds));
                localStorage.setItem('drone_quiz_wrong', JSON.stringify(quizWrongIds));
            }
        }
        
        function saveStudyIndex() {
            localStorage.setItem('drone_study_index', studyProgressIndex);
        }

        function updateDashboard() {
            let currentMastered = isStudyMode ? studyMasteredIds : quizMasteredIds;
            let currentWrong = isStudyMode ? studyWrongIds : quizWrongIds;

            document.getElementById('stat-mastered').innerText = currentMastered.length;
            document.getElementById('stat-wrong').innerText = currentWrong.length;
            
            let unseenCount = Math.max(0, totalQuestions - currentMastered.length - currentWrong.length);
            document.getElementById('stat-unseen').innerText = unseenCount;
            document.getElementById('label-unseen').innerText = isStudyMode ? '📦 未觀看' : '📦 未作答';

            const toggleExam = document.getElementById('toggle-exam');
            const toggleStudy = document.getElementById('toggle-study');
            const btnMain = document.getElementById('btn-start-main');
            const intensiveBtn = document.getElementById('btn-intensive-quiz');
            const reviewBtn = document.getElementById('btn-quick-review-study');
            
            const activeClass = "w-1/2 py-3.5 rounded-xl transition-all z-10 font-bold text-[15px] flex items-center justify-center gap-1 shadow-md bg-white text-blue-600 border border-black/5 dark:bg-slate-700 dark:border-slate-600 dark:text-blue-400";
            const inactiveClass = "w-1/2 py-3.5 rounded-xl transition-all z-10 font-bold text-[15px] flex items-center justify-center gap-1 opacity-70 hover:opacity-100";
            const btnBaseClass = "w-full text-white py-4 rounded-2xl font-bold shadow-lg transition-all flex flex-col items-center justify-center cursor-pointer relative overflow-hidden ";

            if (isStudyMode) {
                toggleStudy.className = activeClass;
                toggleExam.className = inactiveClass;
                btnMain.className = btnBaseClass + "bg-blue-600 hover:bg-blue-500";
                
                btnMain.innerHTML = `
                    <div class="text-[17px] sm:text-lg flex items-center gap-2 tracking-wide">📖 進入看題庫模式 (共 324 題)</div>
                    <div class="text-[13px] font-normal text-blue-200 mt-1.5">循序漸進閱讀，系統自動記憶進度</div>
                `;
                
                intensiveBtn.classList.add('hidden');
                if (studyWrongIds.length > 0) {
                    reviewBtn.classList.remove('hidden');
                    document.getElementById('review-count').innerText = studyWrongIds.length;
                } else reviewBtn.classList.add('hidden');
                
            } else {
                toggleExam.className = activeClass;
                toggleStudy.className = inactiveClass;
                
                if (quizMasteredIds.length >= totalQuestions) {
                    btnMain.className = btnBaseClass + "bg-yellow-500 hover:bg-yellow-400 shadow-yellow-500/40 shadow-xl scale-[1.02] mt-2 mb-2";
                    btnMain.innerHTML = `
                        <div class="text-[22px] flex items-center gap-2 drop-shadow-md tracking-wide">🏆 您已精通全部 324 題！</div>
                        <div class="text-[14px] font-bold text-yellow-50 mt-1.5 drop-shadow-sm">點此重置進度並重新開始</div>
                    `;
                } else if (unseenCount > 0) {
                    btnMain.className = btnBaseClass + "bg-blue-600 hover:bg-blue-500";
                    btnMain.innerHTML = `
                        <div class="text-[17px] sm:text-lg flex items-center gap-2 tracking-wide">⏱️ 開始智慧測驗 (共 50 題)</div>
                        <div class="text-[13px] font-normal text-blue-200 mt-1.5">只抽出「未作答」新題，保證不重複</div>
                    `;
                } else {
                    btnMain.className = btnBaseClass + "bg-purple-600 hover:bg-purple-500 shadow-purple-500/40 shadow-xl scale-[1.02] mt-2 mb-2";
                    btnMain.innerHTML = `
                        <div class="text-[20px] flex items-center gap-2 drop-shadow-md tracking-wide">🔥 易錯題無限複習</div>
                        <div class="text-[13px] font-bold text-purple-100 mt-1.5 drop-shadow-sm">新題已掃完，專注消滅待加強弱點</div>
                    `;
                }
                
                if (quizWrongIds.length > 0) {
                    intensiveBtn.classList.remove('hidden');
                    document.getElementById('intensive-count').innerText = quizWrongIds.length;
                } else {
                    intensiveBtn.classList.add('hidden');
                }
                reviewBtn.classList.add('hidden');
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function prepareQuizQueue(type) {
            quizQueue = [];
            let currentWrong = type.includes('study') ? studyWrongIds : quizWrongIds;
            let currentMastered = type.includes('study') ? studyMasteredIds : quizMasteredIds;

            if (type === 'normal_study') {
                for(let i=0; i<totalQuestions; i++) quizQueue.push(i);
            } else if (type === 'review_study') {
                quizQueue = [...currentWrong].sort((a,b) => a-b);
            } else if (type === 'intensive_quiz') {
                quizQueue = [...currentWrong];
                shuffle(quizQueue);
            } else if (type === 'normal_quiz') {
                let unseenPool = [];
                for(let i=0; i<totalQuestions; i++) {
                    if(!currentWrong.includes(i) && !currentMastered.includes(i)) {
                        unseenPool.push(i);
                    }
                }

                if (unseenPool.length > 0) {
                    shuffle(unseenPool);
                    quizQueue = unseenPool.slice(0, 50);
                } else {
                    let wrongPool = [...currentWrong];
                    shuffle(wrongPool);
                    quizQueue = wrongPool.slice(0, 50);
                }
            }
        }

        function startSession(type) {
            if (window.confetti) confetti.reset(); 
            
            isQuizRunning = true;
            currentSessionType = type;
            prepareQuizQueue(type);
            
            if (type === 'normal_study') {
                if (studyProgressIndex >= totalQuestions) {
                    studyProgressIndex = 0;
                    saveStudyIndex();
                }
                currentQuizIndex = studyProgressIndex;
            } else {
                currentQuizIndex = 0;
                examRecords = []; 
            }
            
            scoreCorrect = 0;
            scoreWrong = 0;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const exitBtn = document.getElementById('exit-btn');
            exitBtn.innerText = currentSessionType.includes('study') ? '離開並記錄' : '提早交卷';

            renderQuestion();
        }

        function renderQuestion() {
            if(currentQuizIndex >= quizQueue.length) {
                finishSession();
                return;
            }

            // 【修復】每次渲染題目時，強制解鎖選項容器，防止中斷切換模式時被鎖死
            const container = document.getElementById('options-container');
            container.removeAttribute('disabled'); 
            container.innerHTML = '';
            
            currentQuestionId = quizQueue[currentQuizIndex];
            const qData = questionBank[currentQuestionId];
            const badge = document.getElementById('quiz-mode-badge');
            
            if(currentSessionType === 'normal_study') {
                badge.innerHTML = `📖 看題庫：第 ${currentQuestionId + 1} 題 / 共 324 題`;
                document.getElementById('progress-bar').style.width = `${((currentQuestionId + 1) / 324) * 100}%`;
            } else if (currentSessionType === 'review_study') {
                badge.innerHTML = `🔥 待加強複習：第 ${currentQuizIndex + 1} 題 / 共 ${quizQueue.length} 題`;
                document.getElementById('progress-bar').style.width = `${((currentQuizIndex) / quizQueue.length) * 100}%`;
            } else if (currentSessionType === 'intensive_quiz') {
                badge.innerHTML = `📝 易錯大補帖：第 ${currentQuizIndex + 1} 題 / 共 ${quizQueue.length} 題`;
                document.getElementById('progress-bar').style.width = `${((currentQuizIndex) / quizQueue.length) * 100}%`;
            } else {
                badge.innerHTML = `⏱️ 測驗：第 ${currentQuizIndex + 1} 題 / 共 ${quizQueue.length} 題`;
                document.getElementById('progress-bar').style.width = `${((currentQuizIndex) / quizQueue.length) * 100}%`;
            }
            
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-container').classList.add('hidden');
            
            if (currentQuizIndex > 0 && !currentSessionType.includes('study')) {
                document.getElementById('prev-btn').classList.remove('hidden');
            } else {
                document.getElementById('prev-btn').classList.add('hidden');
            }
            
            let qNum = currentSessionType === 'normal_study' ? (currentQuestionId + 1) : (currentQuizIndex + 1);
            document.getElementById('question-text').innerText = `${qNum}. ${qData.question}`;
            
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn option-text';
                btn.innerText = opt;
                btn.onclick = () => selectOption(btn, index, qData);
                container.appendChild(btn);
            });
        }

        function selectOption(btnElement, index, qData) {
            if(btnElement.parentElement.hasAttribute('disabled')) return;
            btnElement.parentElement.setAttribute('disabled', 'true');

            const isCorrect = (index === qData.answer);
            const container = document.getElementById('options-container');
            const expTitle = document.getElementById('explanation-title');

            if(currentSessionType.includes('study')) {
                // 題庫模式：即時更新記錄，並直接顯示解析
                updateQuestionStatus(currentQuestionId, isCorrect, currentSessionType);

                if(isCorrect) {
                    btnElement.classList.add('correct');
                    expTitle.innerHTML = '<span class="text-green-500">💡 重點解析：</span>';
                } else {
                    btnElement.classList.add('wrong');
                    container.children[qData.answer].classList.add('correct');
                    expTitle.innerHTML = '<span class="text-red-500">💡 錯題解析：</span>';
                }
                
                document.getElementById('explanation-text').innerText = qData.explanation;
                document.getElementById('explanation-container').classList.remove('hidden');
                document.getElementById('next-btn').classList.remove('hidden');
                
                if (currentSessionType === 'normal_study') {
                    studyProgressIndex = currentQuizIndex + 1;
                    saveStudyIndex();
                }
                
            } else {
                // 測驗模式：暫存記錄，延遲結算
                btnElement.classList.add('option-btn-selected');
                if(isCorrect) scoreCorrect++; else scoreWrong++;
                
                examRecords.push({
                    qData: qData,
                    userAnsIndex: index,
                    isCorrect: isCorrect
                });
                
                setTimeout(() => {
                    container.removeAttribute('disabled');
                    nextQuestion();
                }, 400); 
            }
        }

        function nextQuestion() {
            document.getElementById('options-container').removeAttribute('disabled');
            currentQuizIndex++;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuizIndex <= 0) return; 
            
            if (!currentSessionType.includes('study') && examRecords.length > 0) {
                const lastRecord = examRecords.pop();
                if (lastRecord.isCorrect) scoreCorrect--;
                else scoreWrong--;
            }
            
            document.getElementById('options-container').removeAttribute('disabled');
            currentQuizIndex--;
            renderQuestion();
        }

        function exitMode() {
            if (currentSessionType === 'normal_study') {
                showModal("已為您儲存目前的閱讀進度，隨時可以回來接續觀看！", false, () => {
                    isQuizRunning = false;
                    document.getElementById('quiz-screen').classList.add('hidden');
                    document.getElementById('start-screen').classList.remove('hidden');
                    updateDashboard();
                });
            } else if (currentSessionType === 'review_study') {
                showModal("複習隨時可以中斷，錯題依然為您保留在待加強區塊！", false, () => {
                    isQuizRunning = false;
                    document.getElementById('quiz-screen').classList.add('hidden');
                    document.getElementById('start-screen').classList.remove('hidden');
                    updateDashboard();
                });
            } else {
                if (examRecords.length === 0) {
                    showModal("您還沒有作答任何題目，確定要離開嗎？", true, () => {
                        isQuizRunning = false;
                        document.getElementById('quiz-screen').classList.add('hidden');
                        document.getElementById('start-screen').classList.remove('hidden');
                        updateDashboard();
                    });
                } else {
                    showModal(`確定要提早交卷嗎？系統將以您目前已作答的 ${examRecords.length} 題來計算最終成績。`, true, () => {
                        finishSession();
                    });
                }
            }
        }

        function finishSession() {
            if(currentSessionType === 'normal_study') {
                showModal("恭喜！您已將所有 324 題題庫閱讀完畢，進度已為您自動歸零，可重新刷題。", false, () => {
                    studyProgressIndex = 0;
                    saveStudyIndex();
                    isQuizRunning = false;
                    document.getElementById('quiz-screen').classList.add('hidden');
                    document.getElementById('start-screen').classList.remove('hidden');
                    updateDashboard();
                });
                return;
            } else if (currentSessionType === 'review_study') {
                showModal("太棒了！您已將本次待加強的題目複習完畢！", false, () => {
                    isQuizRunning = false;
                    document.getElementById('quiz-screen').classList.add('hidden');
                    document.getElementById('start-screen').classList.remove('hidden');
                    updateDashboard();
                });
                return;
            }
            
            // 測驗模式正式結算，將暫存成績寫入系統
            examRecords.forEach(record => {
                updateQuestionStatus(record.qData.id, record.isCorrect, currentSessionType);
            });
            
            isQuizRunning = false;
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            let attemptedCount = examRecords.length; 
            let finalScore = 0;
            if (attemptedCount > 0) {
                finalScore = Math.round((scoreCorrect / attemptedCount) * 100);
            }
            
            document.getElementById('final-score').innerText = finalScore;
            document.getElementById('result-correct').innerText = scoreCorrect;
            document.getElementById('result-wrong').innerText = scoreWrong;
            
            const badge = document.getElementById('result-badge');
            const wrongSection = document.getElementById('wrong-review-section');
            const wrongList = document.getElementById('wrong-answers-list');
            wrongList.innerHTML = ''; 
            
            if(finalScore === 100 && attemptedCount > 0) {
                badge.innerText = '✅ 滿分過關，實力堅強！';
                badge.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-6 border border-green-500 bg-green-500/10 text-green-500 shadow-sm';
                wrongSection.classList.add('hidden');
                
                if(window.confetti) {
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'] });
                    setTimeout(() => confetti({ particleCount: 100, spread: 100, origin: { y: 0.5 }, colors: ['#fbbf24', '#f59e0b'] }), 1000);
                }
            } else {
                badge.innerText = finalScore >= 80 ? '✅ 及格，錯題已為您保留至「待加強」區塊。' : '❌ 不及格，錯題已為您保留至「待加強」區塊。';
                badge.className = finalScore >= 80 ? 'inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-6 border border-blue-500 bg-blue-500/10 text-blue-500 shadow-sm' : 'inline-block px-4 py-1.5 rounded-full text-sm font-bold mb-6 border border-red-500 bg-red-500/10 text-red-500 shadow-sm';
                wrongSection.classList.remove('hidden');
            }

            if(finalScore < 100 && attemptedCount > 0) {
                examRecords.forEach((record, index) => {
                    if(!record.isCorrect) {
                        const card = document.createElement('div');
                        card.className = 'p-5 rounded-xl border wrong-card shadow-sm text-left';
                        card.innerHTML = `
                            <div class="font-bold text-[17px] mb-4 flex items-start gap-2 leading-relaxed">
                                <span class="text-red-500 shrink-0 mt-0.5">✖</span>
                                <span>第 ${index + 1} 題：${record.qData.question}</span>
                            </div>
                            <div class="text-[15px] mb-2 text-red-500 font-bold pl-6">您的答案：${record.qData.options[record.userAnsIndex]}</div>
                            <div class="text-[15px] mb-5 text-green-600 font-bold pl-6">正確答案：${record.qData.options[record.qData.answer]}</div>
                            <div class="p-4 rounded-lg explanation-box text-[15px] leading-relaxed mt-2 shadow-inner">
                                <span class="font-bold">💡 錯題解析：</span><br>${record.qData.explanation}
                            </div>
                        `;
                        wrongList.appendChild(card);
                    }
                });
            }
        }

        function returnToHome() {
            if(window.confetti) confetti.reset(); 
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            updateDashboard();
        }

        function resetProgress(isStudy) {
            showModal(`確定要將 ${isStudy?'看題庫':'測驗'} 的「紀錄與錯題本」歸零嗎？這將無法復原！`, true, () => {
                if (isStudy) {
                    studyMasteredIds = [];
                    studyWrongIds = [];
                    studyProgressIndex = 0;
                    localStorage.setItem('drone_study_mastered', '[]');
                    localStorage.setItem('drone_study_wrong', '[]');
                    saveStudyIndex();
                } else {
                    quizMasteredIds = [];
                    quizWrongIds = [];
                    localStorage.setItem('drone_quiz_mastered', '[]');
                    localStorage.setItem('drone_quiz_wrong', '[]');
                }
                updateDashboard();
                showModal("進度已為您重置完成，可展開全新挑戰！", false);
            });
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-content');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                }, 10);
            } else {
                modal.classList.add('opacity-0');
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }

        function setTheme(theme) {
            document.body.classList.remove('theme-dark', 'theme-warm', 'theme-light');
            document.body.classList.add(`theme-${theme}`);
            
            ['dark', 'warm', 'light'].forEach(t => {
                const btn = document.getElementById(`theme-${t}`);
                if (t === theme) {
                    btn.classList.add('setting-btn-active');
                    btn.classList.remove('setting-btn-inactive');
                } else {
                    btn.classList.add('setting-btn-inactive');
                    btn.classList.remove('setting-btn-active');
                }
            });
            localStorage.setItem('drone_theme', theme);
        }

        function setFontSize(size) {
            document.body.classList.remove('font-normal', 'font-large', 'font-xlarge');
            document.body.classList.add(`font-${size}`);
            
            ['normal', 'large', 'xlarge'].forEach(s => {
                const btn = document.getElementById(`font-${s}`);
                if (s === size) {
                    btn.classList.add('setting-btn-active');
                    btn.classList.remove('setting-btn-inactive');
                } else {
                    btn.classList.add('setting-btn-inactive');
                    btn.classList.remove('setting-btn-active');
                }
            });
            localStorage.setItem('drone_fontsize', size);
        }

        function loadSettings() {
            setTheme(localStorage.getItem('drone_theme') || 'dark');
            setFontSize(localStorage.getItem('drone_fontsize') || 'normal');
        }
    </script>
</body>
</html>
