<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0F172A">
    <title>遙控無人機學科測驗系統 (終極完整版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', 'PingFang TC', 'Heiti TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .gold-shimmer {
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 50%, #fbbf24 100%);
            background-size: 200% auto;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* 📖 暖色護眼主題 (Warm Theme) */
        body.theme-warm { background-color: #EFECE6 !important; color: #475569 !important; }
        body.theme-warm #start-screen, body.theme-warm #quiz-screen > div, body.theme-warm #result-screen { background-color: #FDFCF8 !important; border-color: #E5E1D8 !important; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05) !important; }
        body.theme-warm h1, body.theme-warm h2, body.theme-warm #question-text, body.theme-warm .stat-val { color: #1E293B !important; }
        body.theme-warm .option-btn-default { background-color: #FFFFFF !important; border-color: #D6D3CD !important; color: #334155 !important; }
        body.theme-warm .stat-bg { background-color: #FFFFFF !important; border-color: #E5E1D8 !important; }
        body.theme-warm p.text-slate-400 { color: #64748B !important; }
        body.theme-warm #prev-btn { background-color: #F1F5F9 !important; border-color: #CBD5E1 !important; color: #475569 !important; }
        body.theme-warm .review-card { background-color: #FFFFFF !important; border-color: #FECACA !important; }
        body.theme-warm .review-card p.text-slate-100 { color: #1E293B !important; }
        body.theme-warm .review-exp { background-color: #F0F9FF !important; border-color: #BAE6FD !important; }
        body.theme-warm .review-exp p { color: #0369A1 !important; }

        /* ☀️ 明亮簡潔主題 (Light Theme) */
        body.theme-light { background-color: #F3F4F6 !important; color: #374151 !important; }
        body.theme-light #start-screen, body.theme-light #quiz-screen > div, body.theme-light #result-screen { background-color: #FFFFFF !important; border-color: #E5E7EB !important; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05) !important; }
        body.theme-light h1, body.theme-light h2, body.theme-light #question-text, body.theme-light .stat-val { color: #111827 !important; }
        body.theme-light .option-btn-default { background-color: #F9FAFB !important; border-color: #D1D5DB !important; color: #1F2937 !important; }
        body.theme-light .stat-bg { background-color: #F9FAFB !important; border-color: #E5E7EB !important; }
        body.theme-light p.text-slate-400 { color: #6B7280 !important; }
        body.theme-light #prev-btn { background-color: #F3F4F6 !important; border-color: #D1D5DB !important; color: #374151 !important; }
        body.theme-light .review-card { background-color: #FEF2F2 !important; border-color: #FCA5A5 !important; }
        body.theme-light .review-card p.text-slate-100 { color: #111827 !important; }
        body.theme-light .review-exp { background-color: #EFF6FF !important; border-color: #BFDBFE !important; }
        body.theme-light .review-exp p { color: #1D4ED8 !important; }

        /* 🔍 字體放大動態類別 (Text Zoom) */
        body.zoom-large #question-text { font-size: 1.35rem !important; line-height: 2rem !important; }
        body.zoom-large .option-btn { font-size: 1.15rem !important; padding: 1.25rem !important; }
        
        body.zoom-xl #question-text { font-size: 1.55rem !important; line-height: 2.25rem !important; }
        body.zoom-xl .option-btn { font-size: 1.3rem !important; padding: 1.5rem !important; }
    </style>
</head>
<body class="bg-[#0F172A] min-h-screen text-slate-300 pb-40 antialiased theme-dark zoom-normal transition-colors duration-300">
    
    <!-- 懸浮設定按鈕 -->
    <button onclick="toggleSettings()" class="fixed top-3 right-3 sm:top-6 sm:right-6 z-50 bg-slate-800/80 backdrop-blur-md text-white p-2.5 sm:p-3 rounded-full shadow-lg border border-slate-600 hover:bg-slate-700 transition-all">
        <svg class="w-5 h-5 sm:w-6 sm:h-6 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>

    <!-- 設定面板 Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4 fade-in">
        <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 border border-slate-700 shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white flex items-center"><span class="mr-2">⚙️</span> 顯示設定</h3>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white text-3xl leading-none">&times;</button>
            </div>
            
            <!-- 字體大小 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-400 mb-3">字體大小設定</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setTextSize('normal')" id="btn-size-normal" class="py-2.5 rounded-xl border border-slate-600 bg-slate-700 text-white text-sm font-medium transition-all">標準</button>
                    <button onclick="setTextSize('large')" id="btn-size-large" class="py-2.5 rounded-xl border border-slate-600 bg-slate-700 text-white text-base font-bold transition-all">放大</button>
                    <button onclick="setTextSize('xl')" id="btn-size-xl" class="py-2.5 rounded-xl border border-slate-600 bg-slate-700 text-white text-lg font-black transition-all">特大</button>
                </div>
            </div>
            
            <!-- 背景主題 -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-slate-400 mb-3">護眼背景主題</label>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="setTheme('dark')" id="btn-theme-dark" class="py-3 rounded-xl border border-slate-600 bg-[#0F172A] text-slate-300 text-sm font-bold flex flex-col items-center transition-all shadow-inner"><span class="text-xl mb-1">🌙</span>深色</button>
                    <button onclick="setTheme('warm')" id="btn-theme-warm" class="py-3 rounded-xl border border-amber-200 bg-[#FDFCF8] text-amber-900 text-sm font-bold flex flex-col items-center transition-all shadow-sm"><span class="text-xl mb-1">📖</span>暖色</button>
                    <button onclick="setTheme('light')" id="btn-theme-light" class="py-3 rounded-xl border border-slate-300 bg-white text-slate-800 text-sm font-bold flex flex-col items-center transition-all shadow-sm"><span class="text-xl mb-1">☀️</span>明亮</button>
                </div>
            </div>

            <!-- 測驗模式切換 -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-slate-400 mb-3">測驗模式設定 <span id="mode-warning" class="hidden text-xs text-red-400 ml-1">(測驗進行中無法切換)</span></label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setMode('exam')" id="btn-mode-exam" class="py-3 rounded-xl border border-slate-600 bg-slate-700 text-white text-sm font-bold flex flex-col items-center transition-all">
                        <span class="text-xl mb-1">⏱️</span>
                        <span>測驗模式</span>
                        <span class="text-[10px] text-slate-300 mt-1 font-normal">限時挑戰，統一結算</span>
                    </button>
                    <button onclick="setMode('practice')" id="btn-mode-practice" class="py-3 rounded-xl border border-slate-600 bg-slate-700 text-white text-sm font-bold flex flex-col items-center transition-all">
                        <span class="text-xl mb-1">🧠</span>
                        <span>練習模式</span>
                        <span class="text-[10px] text-slate-300 mt-1 font-normal">即時對錯，當下解析</span>
                    </button>
                </div>
            </div>
            
            <button onclick="toggleSettings()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold text-lg transition-colors">確認套用</button>
        </div>
    </div>

    <div id="app" class="max-w-3xl mx-auto pt-3 sm:pt-8 px-3 sm:px-4">
        
        <!-- 開始畫面 -->
        <div id="start-screen" class="bg-[#1E293B] p-6 sm:p-10 rounded-3xl shadow-2xl text-center border border-slate-700 fade-in relative overflow-hidden">
            <div class="w-20 h-20 bg-blue-900/50 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <!-- 隱藏彩蛋：連續點擊標題 5 下觸發全通關 (移除 hover 相關特效，徹底隱形) -->
            <h1 id="main-title" class="text-2xl sm:text-3xl font-bold mb-4 text-white select-none">專業操作證學科刷題系統</h1>
            <p class="text-slate-400 mb-6 leading-relaxed text-sm sm:text-base">系統具備記憶篩選機制：<strong class="text-green-400">答對的題目將永久鎖定不再出現</strong>，<strong class="text-rose-400">答錯的題目將在下次測驗優先出現</strong>。不斷篩選，直到您徹底制霸全部 324 題！</p>
            
            <div class="grid grid-cols-3 gap-2 sm:gap-4 mb-8">
                <div class="stat-bg bg-[#0F172A] p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm transition-all duration-300 transform hover:scale-105">
                    <span class="block text-xs sm:text-sm text-green-400 font-bold mb-1">✅ 已精通</span>
                    <span id="stat-mastered" class="stat-val text-2xl sm:text-3xl font-black text-white">0</span>
                </div>
                <div class="stat-bg bg-[#0F172A] p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm transition-all duration-300 transform hover:scale-105">
                    <span class="block text-xs sm:text-sm text-orange-400 font-bold mb-1">🔥 待加強</span>
                    <span id="stat-wrong" class="stat-val text-2xl sm:text-3xl font-black text-white">0</span>
                </div>
                <div class="stat-bg bg-[#0F172A] p-3 sm:p-4 rounded-2xl border border-slate-700 shadow-sm transition-all duration-300 transform hover:scale-105">
                    <span class="block text-xs sm:text-sm text-slate-400 font-bold mb-1">📦 未作答</span>
                    <span id="stat-unseen" class="stat-val text-2xl sm:text-3xl font-black text-white">324</span>
                </div>
            </div>

            <div class="space-y-4 relative z-10">
                <!-- 新增：中斷恢復按鈕 -->
                <button id="btn-resume" onclick="resumeQuiz()" class="hidden w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-emerald-500/20 flex items-center justify-center transform hover:scale-[1.02] mb-4">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    🔄 繼續上次未完成的測驗
                </button>

                <!-- 修正了陰影 shadow-blue-200 -> shadow-blue-500/20 -->
                <button id="btn-smart" onclick="startQuiz('smart')" class="w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white py-4 sm:py-5 rounded-2xl font-bold text-lg sm:text-xl shadow-lg shadow-blue-500/20 flex flex-col items-center justify-center transform hover:scale-[1.02]">
                    <span>🧠 開始智慧配題 (共 50 題)</span>
                    <span class="text-xs sm:text-sm font-normal text-blue-200 mt-1">優先複習「待加強」並補齊「未作答」新題</span>
                </button>

                <button id="btn-wrong" onclick="startQuiz('wrong_only')" class="hidden w-full bg-orange-500 hover:bg-orange-600 transition-colors text-white py-4 rounded-2xl font-bold text-lg shadow-md flex items-center justify-center transform hover:scale-[1.02]">
                    🚨 錯題地獄特訓 (專注消滅待加強區塊)
                </button>

                <button id="btn-history" onclick="startQuiz('history')" class="hidden w-full bg-purple-600 hover:bg-purple-700 transition-colors text-white py-4 rounded-2xl font-bold text-lg shadow-md flex flex-col items-center justify-center transform hover:scale-[1.02]">
                    <span>📝 歷史易錯題大補帖</span>
                    <span class="text-xs sm:text-sm font-normal text-purple-200 mt-1">針對您曾經錯過的題目進行重點考前衝刺</span>
                </button>
            </div>

            <!-- 歸零按鈕 -->
            <div class="mt-8 text-center">
                <button onclick="resetProgress()" class="text-slate-400 hover:text-red-500 text-sm font-medium transition-colors underline decoration-dotted">
                    🔄 重新重置進度 (將一切記錄歸零)
                </button>
            </div>
        </div>

        <!-- 測驗畫面 -->
        <div id="quiz-screen" class="hidden fade-in">
            <div class="bg-[#1E293B] p-4 sm:p-8 rounded-2xl sm:rounded-3xl shadow-2xl border border-slate-700 mb-4">
                <!-- 進度條與計時器 -->
                <div class="flex justify-between items-end mb-2 sm:mb-4">
                    <span id="progress-text" class="text-xs sm:text-sm font-bold text-blue-300 bg-blue-900/40 py-1 px-3 rounded-lg border border-blue-800/50">第 1 題 / 共 50 題</span>
                    <span id="timer-text" class="text-xs sm:text-sm font-bold text-orange-300 bg-orange-900/40 py-1 px-3 rounded-lg border border-orange-800/50 hidden">⏱️ 30:00</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-1.5 sm:h-2 mb-4 sm:mb-8">
                    <div id="progress-bar" class="bg-blue-500 h-1.5 sm:h-2 rounded-full transition-all duration-300" style="width: 2%"></div>
                </div>
                
                <!-- 題目 -->
                <h2 id="question-text" class="text-lg sm:text-2xl font-bold mb-4 sm:mb-8 leading-relaxed text-white"></h2>
                
                <!-- 選項 -->
                <div id="options" class="space-y-2.5 sm:space-y-4"></div>
                
                <!-- 練習模式專用：即時解析 -->
                <div id="practice-exp" class="hidden mt-6 fade-in"></div>
            </div>
            
            <div class="flex gap-3">
                <!-- 上一題按鈕 (測驗模式) -->
                <button id="prev-btn" onclick="prevQuestion()" class="flex-1 bg-slate-800 border-2 border-slate-700 text-slate-300 hover:bg-slate-700 py-3 sm:py-4 rounded-xl sm:rounded-2xl font-bold transition-colors hidden shadow-sm text-base sm:text-lg">
                    ← 返回上一題
                </button>
                <!-- 下一題按鈕 (練習模式) -->
                <button id="next-action-btn" onclick="nextPracticeQuestion()" class="flex-1 bg-blue-600 border-2 border-blue-500 text-white hover:bg-blue-700 py-3 sm:py-4 rounded-xl sm:rounded-2xl font-bold transition-colors hidden shadow-md text-base sm:text-lg">
                    下一題 →
                </button>
            </div>
        </div>

        <!-- 結果畫面 -->
        <div id="result-screen" class="hidden bg-[#1E293B] p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-700 fade-in">
            <div class="text-center mb-8">
                <h2 class="font-bold text-2xl mb-2 text-white">本回合測驗結果</h2>
                <div id="pass-status" class="mb-4 font-bold text-lg"></div>
                <div class="bg-[#0F172A] inline-block px-10 py-6 rounded-3xl border border-slate-700">
                    <span class="text-sm text-slate-400 font-bold block mb-1">本次得分</span>
                    <span id="score" class="text-6xl font-black text-blue-400"></span>
                </div>
            </div>
            
            <h3 id="review-title" class="font-bold text-xl mb-4 text-slate-200 flex items-center">
                <svg class="w-6 h-6 mr-2 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                錯題解析與補強 (已自動加入待加強區塊)
            </h3>
            <div id="review" class="space-y-6 max-h-[600px] overflow-y-auto pr-2 custom-scrollbar mb-8"></div>
            
            <hr class="border-slate-700 mb-6">
            
            <!-- 動態生成的按鈕區塊 -->
            <div id="action-buttons" class="flex flex-col gap-4"></div>

        </div>
    </div>

    <!-- 現代化極簡底部品牌列 (Sticky Footer) - 增加 bottom-[60px] 避開免空平台廣告 -->
    <div id="brand-footer" class="fixed bottom-[60px] left-0 w-full z-40 pointer-events-none transition-opacity duration-300">
        <div id="footer-gradient" class="h-8 bg-gradient-to-t from-[#0F172A]/95 to-transparent transition-colors duration-300"></div>
        <div id="footer-bg" class="bg-[#0F172A]/90 backdrop-blur-xl border-t border-slate-800 py-3 pointer-events-auto shadow-lg transition-colors duration-300">
            <div class="max-w-3xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-0">
                <p class="text-slate-400 text-[11px] sm:text-xs font-semibold tracking-widest uppercase">
                    System Design & Technical Support
                </p>
                <div id="footer-pill" class="flex items-center bg-slate-800 border border-slate-700 px-3.5 py-1.5 rounded-full text-slate-300 font-extrabold text-sm sm:text-base tracking-wide shadow-sm hover:shadow hover:border-blue-500 hover:text-blue-400 transition-all cursor-default">
                    <svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-blue-500 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                    </svg>
                    ChamiVision
                </div>
            </div>
        </div>
    </div>

    <script>
        const fullBank = [
            {q:"下列何者為於遙控無人機飛航活動期間,實際操控遙控無人機並應負飛航安全責任之人員?",options:["(A)遙控無人機操作人。","(B)目視觀察員。","(C)觀察員。","(D)協調員。"],correct:0},
            {q:"下列何者為於延伸視距飛航作業時,持有遙控無人機操作證,並於遙控無人機活動期間,提供實際操控遙控無人機之操作人必要飛航資訊之人員?",options:["(A)遙控無人機操作人。","(B)目視觀察員。","(C)觀察員。","(D)協調員。"],correct:1},

            {q:"下列何種感測器不是用來測量無人機方位、高度和速度?",options:["(A)GPS、羅盤。","(B)氣壓計。","(C)溫度計。","(D)3軸陀螺儀/3軸加速規。"],correct:2},
            {q:"下列何者不是用來描述無人機的特性?",options:["(A)軸距、重量、抗風能力。","(B)塗裝與價格。","(C)巡航速度與最大速度、升限。","(D)單人操作還是多人協同操作。"],correct:1},
            {q:"最大起飛重量10公斤的無人多旋翼機約可載重幾公斤?",options:["(A)2.5公斤。","(B)2公斤。","(C)1.5公斤。","(D)1公斤。"],correct:0},
            {q:"GPS天線為何需要天線支架?",options:["(A)增加美觀。","(B)避開人口聚集區域。","(C)防止電磁干擾。","(D)減低風速與風向的影響。"],correct:2},
            {q:"IMU (inertial measurement unit,慣性量測單元)是用3個軸向的陀螺儀及加速規,來量測無人機的下列何者?",options:["(A)3個軸向的高度及位置。","(B)3個軸向的姿態角及加速度。","(C)3個軸向的姿態角及速度。","(D)3個軸向的高度及加速度。"],correct:1},
            {q:"陀螺儀(gyroscope)主要由一個位於軸心的轉子構成,依據角動量守恆原理,轉子旋轉時產生的角動量有抗拒方位改變的特性,用此特性來感測和維持下列何者?",options:["(A)方位及角速度。","(B)高度及角速度。","(C)方位及高度。","(D)以上皆是。"],correct:0},
            {q:"加速規(accelerometer)又稱加速度計,利用壓電效應、壓阻效應、或電容式感應等作用原理,來測量下列何者?",options:["(A)高度。","(B)位置。","(C)速度。","(D)加速度。"],correct:3},
            {q:"無人飛機在視距外發生「發電機失效(動力系統正常)」,緊急處置程序之一為下列何者?",options:["(A)切入返航模式。","(B)立即關閉航機所有電力驅動之酬載裝置。","(C)立即關閉航機除第一人稱影像外之非必要酬載設備。","(D)開啟自動避障系統。"],correct:2},
            {q:"無人飛機在視距外發生「發電機失效(動力系統正常)」時,關閉非必要酬載設備之目的下列何者為非?",options:["(A)減緩蓄電池之電力消耗。","(B)將電力留存供伺服舵機使用。","(C)緩解發電機之振動影響航機穩定操作。","(D)將電力留存供飛控電腦等必要裝備使用。"],correct:2},
            {q:"無人飛機在視距外發生「引擎或動力失效」,緊急處置程序之一為下列何者?",options:["(A)切入自動駕駛模式。","(B)分析無人機現有高度與飄降距離。","(C)檢查確認地面導控站硬體接線。","(D)開啟慣性導航系統。"],correct:1},
            {q:"無人飛機在視距外發生「引擎或動力失效」,若高度不足以飄降回本場,則參考下列何者將無人機飛至安全區域迫降?",options:["(A)姿態儀及酬載影像。","(B)壓力高度。","(C)風速風向。","(D)雲幕高及能見度。"],correct:0},
            {q:"無人飛機在視距外發生「引擎或動力失效」,若操作人分析當下高度不足以飄降回本場,下列處置程序何者為非?",options:["(A)參考姿態儀。","(B)參考酬載影像。","(C)帶桿增加航機攻角。","(D)儘速以飄降方式將航機飛至安全區域實施異地迫降。"],correct:2},
            {q:"最佳飄降速度定義為下列何者?",options:["(A)無風環境下,無動力之定翼機下降單位高度可定向飛行最大距離之空速。","(B)背風時一定的高度減少下,無動力之定翼機可定向飛行最大距離的速度。","(C)迎風時一定的高度減少下,無動力之定翼機可定向飛行最大距離之速度。","(D)無風環境下,無動力之定翼機下降單位高度可定向飛行最大距離之地速。"],correct:0},
            {q:"無人飛機在視距內發生「引擎或動力失效」,緊急處置程序之一為下列何者?",options:["(A)儘速以返航模式落地。","(B)檢查確認地面導控站硬體接線。","(C)開啟自動避障系統。","(D)切換至適當之操作模式,及時依現場風向風速妥適調整航向及各操縱面以保持空速及姿態。"],correct:3},
            {q:"無人飛機在視距內發生「引擎或動力失效」,緊急處置程序之一為下列何者為非?",options:["(A)立即切入適當之操作模式。","(B)依現場風向風速妥適調整航向以保持空速及姿態。","(C)依現場風向風速妥適調整各操縱面以保持空速及姿態。","(D)依現場風向風速妥適調整航向及各操縱面以保持航機高度。"],correct:3},
            {q:"無人直昇機與多旋翼機在視距外發生「引擎或動力失效」,緊急處置程序之一為下列何者?",options:["(A)立即切入自動駕駛模式。","(B)若航機尚存部份動力,應儘速穩定姿態並減緩下降率,以第一人稱方式尋找安全地點實施異地迫降。","(C)若尚存部份控制能力,應儘速大角度迴轉,拉高高度後以穩定姿態返場降落。","(D)檢查確認地面導控站GPS訊號品質。"],correct:1},
            {q:"無人直昇機與多旋翼機在視距外發生「動力系統失效」之緊急處置程序為下列何者?",options:["(A)開啟自動避障功能。","(B)若不足以返場降落,應避開人、車、物,循備降場或安全平坦處作預防性飄降。","(C)應立即記錄最終定位座標,儘速前往可能之墜落地點查看,視需要通報相關單位處理。","(D)切入返航模式。"],correct:2},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,緊急處置程序之一為下列何者?",options:["(A)關閉無人飛機上不必要之電力裝置。","(B)開啟自動避障系統。","(C)飄降回本場。","(D)無人飛機自動或人為切入返航模式。"],correct:3},
            {q:"無人機操作模式之「返航模式」(return to home)指的是下列何者?",options:["(A)飛向預先設定之歸航點,並於歸航點自動降落或盤旋/停懸至切出返航模式或油量/電量耗盡。","(B)在切入返航模式當時的位置,盤旋至切出返航模式或油量/電量耗盡。","(C)在切入返航模式當時的位置往東5km,盤旋至切出返航模式或油量/電量耗盡。","(D)在切入返航模式當時的位置往北5km,盤旋至切出返航模式或油量/電量耗盡。"],correct:0},
            {q:"無人機飛行控制器系統,其上傳鏈路(遙控訊號)之失效保護(Fail Safe)預設值,其觸發動作下列何者為非?",options:["(A)自主飛行。","(B)自動返航。","(C)原地降落。","(D)原地盤旋或懸停。"],correct:0},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,若無法恢復控制鏈路或航機接收端異常,其失效保護機制(Fail Safe)將觸發下列何者?",options:["(A)自主飛行。","(B)自動拉高。","(C)自動降落。","(D)自動返航。"],correct:3},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,緊急處置程序之一為下列何者?",options:["(A)關閉無人機上不必要之電力裝置。","(B)分析上傳鏈路失效原因為干擾/遮蔽、地面導控站(發射端)異常、或航機(接收端)異常。","(C)開啟自動避障系統。","(D)飄降回本場。"],correct:1},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機。","(B)應立即以地圖介面或酬載影像檢視週遭遮蔽物及干擾源,待航機恢復控制後應立即轉向或爬升脫離。","(C)若干擾/遮蔽狀況持續,應立即切換自動導航模式,繼續飛行。","(D)關閉無人機上不必要之電力裝置。"],correct:1},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,若失效原因為導控站(亦即上傳發射端)異常,則應採取下列何種動作?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機,嘗試恢復控制後飛回本場。","(B)關閉無人飛機上不必要之電力裝置。","(C)在歸航點盤旋至油量/電量耗盡。","(D)開啟自動避障系統。"],correct:0},
            {q:"無人直昇機與多旋翼機在視距外發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機。","(B)應立即以地圖介面或酬載影像檢視週遭遮蔽物及干擾源,待航機恢復控制後應立即轉向或升高脫離。","(C)若干擾/遮蔽狀況持續,應立即切換自動導航模式,繼續飛行。","(D)關閉無人機上不必要之電力裝置。"],correct:1},
            {q:"無人飛機在視距外發生「上傳鏈路失效」,若失效原因為航機(亦即上傳接收端)異常,則應採取下列何種動作?",options:["(A)關閉無人飛機上不必要之電力裝置。","(B)無人飛機將在歸航點盤旋至油量/電量耗盡。","(C)檢查確認導控站硬體接線、更換模組、或重新開機。","(D)可利用地圖介面、即時飛航資訊及酬載影像,全程監控航機是否正確返回歸航點盤旋或降落。"],correct:3},
            {q:"無人飛機在視距內發生「上傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機。","(B)以肉眼檢視週遭潛在遮蔽物及干擾源,待航機恢復控制後應立即轉向或爬升脫離。","(C)關閉無人飛機上不必要之電力裝置。","(D)切換至適當之操作模式,儘速以穩定之滾轉角、俯仰角等飛行姿態落地。"],correct:1},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,緊急處置程序之一為下列何者?",options:["(A)關閉無人飛機上不必要之電力裝置。","(B)調整俯仰姿態以飄降飛回本場。","(C)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以脫離干擾/遮蔽區域。","(D)開啟自動避障系統。"],correct:2},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,緊急處置程序之一為下列何者?",options:["(A)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行第一人稱操作以脫離干擾/遮蔽區域。","(B)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行推桿操作以建立安全空速。","(C)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以脫離干擾/遮蔽區域。","(D)參考航機飛行軌跡及斷訊前回傳之飛航資訊與酬載影像,儘速執行轉向或爬升操作以接近干擾/遮蔽區域。"],correct:2},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,若失效原因為干擾/遮蔽,則等待無人飛機脫離干擾/遮蔽位置後應採取下列何種動作?",options:["(A)應立即切換至適當之操作模式或啟動返航模式。","(B)開啟自動避障系統。","(C)關閉無人機上不必要之電力裝置。","(D)調整俯仰姿態以飄降飛回本場。"],correct:0},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,若失效原因為無人飛機發射端異常,則應採取下列何種動作?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機。","(B)應立即採取減災飛行決策,嘗試恢復鏈路通訊後以第一人稱方式,儘速控制航機以穩定姿態返場降落。","(C)切換至姿態操作模式,儘速參考酬載影像以第一人稱方式將航機飛回本場。","(D)關閉無人飛機上不必要之電力裝置。"],correct:1},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,若失效原因為地面導控站接收端異常,則應採取下列何種動作?",options:["(A)應立即檢診其電源、天線及硬體線路接頭,必要時可更換模組或重新開機以嘗試恢復鏈路通訊。","(B)應立即採取減災飛行決策,嘗試恢復鏈路通訊後以第一人稱方式,儘速控制航機以穩定姿態返場降落。","(C)切換至姿態操作模式,儘速參考酬載影像以第一人稱方式將航機飛回本場。","(D)關閉無人飛機上不必要之電力裝置。"],correct:0},
            {q:"無人飛機在視距內發生「下傳鏈路失效」,緊急處置程序之一為下列何者?",options:["(A)檢查確認導控站硬體接線、更換模組、或重新開機。","(B)應立即切換至適當之操作模式或啟動返航模式,並全程使用第一人稱操作,儘速控制航機以穩定姿態返場降落。","(C)關閉無人飛機上不必要之電力裝置。","(D)應立即切換至適當之操作模式或啟動返航模式,並全程與航機保持目視,儘速控制航機以穩定姿態返場降落。"],correct:3},
            {q:"無人飛機在視距外發生「下傳鏈路失效」,若超過該機合理滯空時間一直未見航機歸航或飛回本場,代表可能發生下列何種狀況?",options:["(A)可能已在其他適當地點安全降落。","(B)可能仍在發生「下傳鏈路失效」當時的位置盤旋。","(C)可能已在下傳斷訊時失事或返航途中失事。","(D)以上皆非。"],correct:2},
            {q:"無人飛機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者?",options:["(A)立即切換至適當之操作模式以停止衛星定位功能介入航機之控制,並由操作人以第一人稱方式接手操作。","(B)調整俯仰姿態以飄降飛回本場。","(C)關閉無人飛機上不必要之電力裝置。","(D)檢查確認導控站硬體接線、更換模組、或重新開機。"],correct:0},
            {q:"無人飛機在視距內發生「衛星定位訊號異常」,緊急處置程序為下列何者?",options:["(A)儘速操控航機轉向或爬升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,並以目視方式控制航機返場降落。","(B)調整俯仰姿態以飄降飛回本場。","(C)關閉無人飛機上不必要之電力裝置。","(D)檢查確認導控站硬體接線、更換模組、或重新開機。"],correct:0},
            {q:"無人直昇機與多旋翼機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者?",options:["(A)儘速操控航機轉向或上升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,待衛星訊號恢復後繼續飛行。","(B)調整俯仰姿態以飄降飛回本場。","(C)關閉無人飛機上不必要之電力裝置。","(D)檢查確認導控站硬體接線、更換模組、或重新開機。"],correct:0},
            {q:"無人直昇機與多旋翼機在視距外發生「衛星定位訊號異常」,緊急處置程序為下列何者為非?",options:["(A)儘速操控航機轉向或上升脫離高樓周圍、橋梁下、峽谷內、密林中及輸電線路周邊等環境,待衛星訊號恢復後繼續飛行。","(B)操作人參考即時飛航資訊、地圖介面及酬載影像以第一人稱方式接手操作。","(C)立即切換至適當之操作模式以停止衛星定位功能介入航機之控制。","(D)若異常狀況持續無法改正,應儘速以目視方式控制航機返場降落。"],correct:3},

            44: "進入限航區或逾 400 呎高空，需發布飛航公告(NOTAM)並與塔台進行「航管協調」以避開飛機。",
            45: "全台負責無人機空域與航管協調的聯繫地點分為「臺北近場臺與高雄近場臺 2 個」。",

            49: "發生死傷、25公斤以上無人機損壞報廢、財產損害逾50萬等重大事件，皆須依法通報（以上皆是）。",
            50: "最大起飛重量「2 公斤以上且具導航裝置」的無人機受損或失蹤，依法必須通報以釐清風險。",

            52: "若在夜間（日落後至日出前）發生實質損害或失蹤事故，因為視線不良風險高，必須通報。",
            53: "只要無人機與空中其他航空器或地面障礙物發生「接近或碰撞」，即屬嚴重飛安事故須通報。",

            55: "「1公斤以上」且具導航設備的無人機，軟體須具備圖資系統以防止誤闖禁飛區(地理圍欄功能)。",
            56: "自然人操作 2公斤以上未達15公斤 且具導航設備的無人機，必須考取「普通操作證」。",
            57: "無人機上市販售前，製造商與進口商必須先向民航局辦理產品「登錄事宜」確認規格。",
            58: "無人機構造依法分為：無人飛機(定翼)、無人直昇機、無人多旋翼機、複合式無人機 共 4 種。",
            59: "具備垂直起降能力(VTOL)的固定翼飛機，同時擁有旋翼與定翼特性，歸類為「複合式無人機」。",
            60: "市售未達「25 公斤」、有導航且經登錄的常見消費級機型，直接列入「免經檢驗或認可」清冊以簡化流程。",
            61: "需實體驗證的無人機，檢驗過關後會取得「檢驗合格證或認可證明文件」。",
            62: "無人機的硬體安全與各項檢驗基準，統一由主管機關「民航局」訂定並發布。",

            66: "爆炸物、毒性物質等危險物品，絕對不得用無人機投擲或噴灑（以上皆是），避免造成嚴重空安災難。",

            70: "未達25kg具導航的無人機，法規限制其最大飛行速度為每小時「87海浬 或 160公里」。",
            71: "延伸視距(EVLOS)的作業極限為：以操作人為中心半徑「900 公尺」內，且高度低於「400 呎」。",
            72: "目視觀察員的工作是代替操作人，全程與「遙控無人機」保持肉眼接觸，並回報動態防撞。",

            77: "大腦負荷限制，一名操作人同一時間只能控制 1 架無人機，故「不得控制 2 架(含)以上」。",
            78: "飛行期間，操作人必須專心致志，隨時監視無人機的「飛航及其周遭狀況」以應付突發事件。",
            79: "操作人有絕對責任操控無人機避讓，以防止與「其他航空器、建築物或障礙物發生接近或碰撞」。",
            80: "法人要執行視距外(BVLOS)這類高風險任務，須於 15 日前檢附計畫書向主管機關「民航局」申請許可。",
            81: "欲飛越集會遊行上空，必須先取得「活動場地之直轄市、縣(市)政府及相關中央主管機關」的同意以安撫群眾風險。",
            82: "法人執行高風險任務的責任險，法定最低保額為：死亡者新臺幣「300 萬元」、重傷者新臺幣「150 萬元」。",
            83: "政府機關執行「災害防救、偵查、調查、矯正業務」等緊急勤務，經同意可不受禁限航區(如紅區)的限制。",
            84: "政府機關執行上述救災與偵查任務，經同意亦可豁免各項「操作限制」(如夜飛、飛越人群等)。",
            85: "違法闖入禁航區、限航區或機場四周(紅黃區)影響民航安全，重罰新臺幣「30 萬元以上 150 萬元以下」。",
            86: "違法超過 400 呎高空飛行，同樣嚴重威脅有人機安全，重罰新臺幣「30 萬元以上 150 萬元以下」。",
            87: "無照駕駛(未領有操作證)操作無人機，處罰新臺幣「6 萬元以上 30 萬元以下」。",
            88: "法人未投保或未足額投保責任險即起飛營業，處罰新臺幣「6 萬元以上 30 萬元以下」。",
            89: "無人機未辦理註冊或未依規定貼上註冊號碼，處罰新臺幣「3 萬元以上 15 萬元以下」。",
            90: "不理會地方政府公告的紅區禁飛規定(如在縣市政府禁飛公園起飛)，處罰新臺幣「3 萬元以上 15 萬元以下」。",
            91: "違反一般操作限制(如擅自夜飛、丟東西、飛越人群)，處罰新臺幣「3 萬元以上 15 萬元以下」。",
            92: "違反產品檢驗、認可、登錄或通報等各項行政管理規則，可彈性處罰新臺幣「1 萬元以上 150 萬元以下」。",
            93: "法人飛航活動申請依緊急程度與流程，分為「一般申請與緊急申請 2 種」。",

            95: "緊急申請(如救災)需填寫緊急申請書，取得同意並通知相關限航管理單位（以上皆是）。",
            96: "在民航局系統中填寫活動範圍時，經緯度座標統一強制採用「度分秒(DMS)」格式輸入。",
            97: "經緯度座標的常見標示法包含度(DD)、度分(DDM)、度分秒(DMS) 共 3 種表示方法。",
            98: "小數換算：0.1度 = 6分，0.4度 = 24分；故北緯25.1度/東經121.4度為：「北緯25度6分，東經121度24分」。",
            99: "小數換算：0.11度 = 6分36秒，0.42度 = 25分12秒；故為「北緯25度6分36秒，東經121度25分12秒」。",
            100: "平均每度緯線的實際物理距離大約為「60浬 (111 km)」。",
            101: "緯度 1 秒的距離，大約為「100呎 (30m)」。",
            102: "臺北飛航情報區的轉換高度(Transition Altitude，切換氣壓設定點)為「11,000 呎」。",
            103: "實際高度(AGL)是指無人機相對於其正下方「地面或水面」的垂直距離。",
            104: "400呎以下的活動與限制區域劃設，皆是以相對於地表障礙物的「實際高度(AGL)」為判定基準。",
            105: "海拔高度(AMSL)是以人為定義的「平均海平面」作為 0 的基準面測定的高度。",
            106: "無人機飛航超過 400 呎需與航管(有人機)協調，此時必須使用航圖通用的「海拔高度資訊(AMSL)」。",
            107: "橢球高(HAE)是真實地表上任一點相對於地球理想橢球面的「垂直距離」。",
            108: "GPS衛星測量技術由於是以地球幾何中心為參考，直接測得的高度是「大地高(橢球高)」。",
            109: "無人機動力系統大致分為電動馬達(驅動電池)及內燃機引擎(吃燃油) 2大類。",
            110: "電動無人機動力系統包含核心的：馬達、電池、電子調速器(ESC)與螺旋槳（以上皆是）。",
            111: "無人機最常使用的是效能高、無碳刷摩擦且壽命長的「無刷直流馬達」。",
            112: "功率的物理定義是：每單位時間所作的功或消耗的能量（做功的速率）。",
            113: "功率的公制單位為瓦(W)；英制通用單位為馬力(HP)。",
            114: "在標準大氣壓下(15℃ 海平面)，空氣密度大約為標準值「1.225 kg/m3」。",
            115: "升力係數是一個表示機翼形狀效率的相對比例常數，屬於「無因次」(dimensionless)，沒有單位。",
            116: "密度高度越高代表空氣越稀薄，故空氣密度減少表示身處「較高的密度高度」。",
            117: "空氣越稀薄(密度減少)，螺旋槳抓不到足夠的空氣分子，動力輸出與升力會隨之「降低」。",
            118: "空氣密度受三大氣象因素影響：高度(氣壓)、溫度及濕度。",
            119: "高度越高空氣越稀薄，為維持同等升力，無人機必須加速以「較高的真空速」飛行來彌補。",
            120: "暖空氣膨脹導致密度變低，為維持升力，飛機必須以「較高的真空速」飛行。",
            121: "濕空氣因較輕的水氣取代了較重的氧氮分子，密度低於乾空氣，需以「較高的真空速」飛行。",
            122: "螺旋槳型號（如1045）前兩碼代表直徑（10英吋），後兩碼代表螺距（4.5英吋），單位皆為「英吋」。",
            123: "槳葉數量越少，受到的空氣擾流干擾越小，故雙葉槳單純的「空氣動力效率」通常高於多葉槳。",
            124: "螺距(Pitch)是指螺旋槳在無滑流介質中旋轉一圈，沿著「軸向」(前進方向)推進的理論幾何距離。",
            125: "無人機螺旋槳材質一般多為硬質塑膠(尼龍)、碳纖維及硬質木頭等輕量高強度材料。",
            126: "CW (Clockwise) 代表順時針方向，CCW (Counter-Clockwise) 代表逆時針方向。",
            127: "測量航模電池主要使用：低電量警報器(BB響)、分壓測電器及三用電表。",
            128: "6S電池有6片電芯，其分壓平衡線包含6條各電芯正極與1條總負極，共「7條線」。",
            129: "電池「並聯」時，總電壓維持不變，但總電容量(mAh)與放電電流會相加升高。",
            130: "外轉無刷馬達型號(如2212)前兩碼為「定子(內部線圈)」的直徑，後兩碼為「定子」的高度。",
            131: "KV值代表無刷馬達特性：每增加 1 伏特(V)電壓，馬達每分鐘所增加的「空轉轉速(rpm)」。",
            132: "螺旋槳必須根據馬達不同的 KV值 與預期推力來做最佳匹配選配。",
            133: "KV值較大代表轉速快但扭力小，適合配「小尺寸的高速槳」；KV值小則扭力大，適合配「大尺寸的低速槳」。",
            134: "理論空轉轉速 = KV值 × 電壓。計算：400 × 22.2 = 8,880 轉。",
            135: "有刷馬達雖然壽命短，但其結構簡單，且啟動時的初始扭矩較大。",
            136: "無刷馬達因無碳刷摩擦，具備無電刷火花、低干擾、噪音低、壽命長等優點（以上皆是）。",
            137: "電調上的 30A 代表該「電子調速器(ESC)」最大允許連續安全通過的電流大小為 30 安培。",
            138: "PWM (脈波寬度調變)是將「類比訊號」轉換為數位脈波的一種電子調變技術。",
            139: "電調損壞更換時，為了確保電流負載安全，只能用「更大安培數」的電子調速器來代替。",
            140: "多旋翼將相鄰螺旋槳設為反向旋轉，利用牛頓第3定律抵銷槳葉產生的反作用力扭矩以保持機身平穩不自旋。",
            141: "依據牛頓第3定律，飛控透過電調改變各槳轉速，產生升力差與扭矩差來實現前後左右等各種姿態動作。",
            142: "六軸總最大電流為 6 × 30A = 180A。故電池的最大放電電流必須「大於」180A 才能確保不崩潰。",
            143: "四軸前進原理：後方螺旋槳(#3,#4)加速抬高機尾，前方減速，機身前傾即產生向前的分力飛行。",
            144: "四軸向左飛行原理：右側螺旋槳(#2,#3)加速抬高右機身，左側減速，機身左傾即向左飛行。",
            145: "原地轉向利用反扭矩：加速對角同向旋轉的槳(#1,#3)，減速另一組，無人機即會原地逆時針轉向。",
            146: "垂直升降：四個螺旋槳同時加速增加總升力即垂直上升，同時減速即垂直下降。",
            147: "四軸無人機在三維空間中具有 6 個自由度（沿3軸平移 + 沿3軸旋轉）。",
            148: "四軸具備的 6 個自由度為：平移的上下、左右、前後，以及旋轉的滾轉、俯仰、偏航（以上皆是）。",
            149: "無人機保持固定功率與姿態的「勻速飛行」最省電，頻繁的急煞加減速會耗費大量額外電能。",
            150: "直昇機的揮舞運動(Flapping)是指旋翼槳葉在旋轉時的「上下撲動」，用以平衡前進時左右升力不對稱。",
            151: "直昇機的擺振運動(Lead-lag)是指旋翼槳葉在旋轉平面上，受哥氏力影響產生的「前後擺動」。",
            152: "飛行前檢查應涵蓋硬體（導控站、無人機）、軟體設定、周邊環境與天氣狀況，以確保任務安全。",
            153: "「遙控動作與無人機匹配性」屬於遙控器與飛控系統的連動檢查，並非地面導控站（電腦/平板）本身的硬體檢查。",
            154: "GPS衛星數是機載接收器負責抓取的資料，通常顯示在地面站螢幕上，不屬於遙控器硬體本身的檢查。",
            155: "搖桿微調（Trim）位置合適性是針對「遙控器」的檢查項目，而非機身。",
            156: "「數傳信號」屬於通訊與控制信號鏈路的檢查，不屬於單純的電池檢查項目。",
            157: "「螺旋槳和機架完整」是針對無人機本體的機身檢查，而非周邊環境檢查。",
            158: "無人多旋翼機構型包含機架、飛控、馬達、電調、螺旋槳、電池等核心部件（以上皆是）。",
            159: "溫度計用來測量環境溫度，無法用來測量無人機的方位、高度或飛行速度。",
            160: "塗裝與價格屬商業或外觀資訊，不用於描述無人機的物理或飛行性能特性。",
            161: "一般商用多旋翼無人機的安全有效載荷（Payload）約為最大起飛重量的 20%~30%，故 10 公斤機型約可載重 2~2.5 公斤。",
            162: "機身內部的電調（ESC）與大電流排線會產生強烈的電磁干擾（EMI），將 GPS 天線架高可有效避免干擾以維持定位精準。",
            163: "慣性量測單元（IMU）包含陀螺儀（測量 3 軸姿態角/角速度）與加速規（測量 3 軸加速度）。",
            164: "陀螺儀利用轉子高速旋轉產生的角動量守恆特性，來感測航機的方位變化與角速度。",
            165: "加速規（Accelerometer）利用壓電或壓阻效應等原理，專門用來測量機體的「加速度」。",
            166: "視距外發生發電機失效但動力正常時，應立即關閉第一人稱影像（FPV）以外的「非必要酬載設備」，以節省剩餘備用電池電力供返航使用。",
            167: "關閉非必要設備的唯一目的是「節省電力」，與緩解發電機的振動無關。",
            168: "定翼機（無人飛機）動力失效後仍具備滑翔能力，故第一步應先「分析現有高度與可飄降的距離」。",
            169: "若高度不足以滑翔回本場，必須依靠「姿態儀與酬載影像（第一人稱畫面）」尋找平坦且無人的安全區域進行迫降。",
            170: "無動力狀態下若「帶桿增加航機攻角」會導致空速急遽下降，引發失速直接墜毀，是絕對禁止的錯誤處置。",
            171: "最佳飄降速度是指在無風狀態下，無動力定翼機能以最少的高度消耗，滑翔最遠距離的空速（L/D Max）。",
            172: "視距內發生動力失效，應立即切換至姿態或手動模式，順應風向風速調整航向，維持安全空速與姿態進行迫降。",
            173: "無動力時首要條件是「保持安全空速以防失速」，絕對不能為了「保持航機高度」而猛拉機頭，這會導致失速墜機。",
            174: "多旋翼無滑翔能力，動力失效尚存部分控制力時，只能盡量穩定姿態減緩下降，並利用影像尋找安全地異地迫降。",
            175: "多旋翼動力若完全失效將直接墜落，操作人應立即記錄最後的 GPS 定位座標，趕往墜落地點查看是否造成災損並視情況通報。",
            176: "上傳鏈路（遙控訊號）失效時，無人飛機會觸發失效保護，標準處置包含自動切入「返航模式」飛回本場。",
            177: "「返航模式」是指無人機自動飛向預設的歸航點（Home Point），並在該處自動降落或盤旋直至電量耗盡。",
            178: "鏈路失效的保護機制預設多為原地懸停、自動降落、自動返航，絕不會預設為讓無人機繼續「自主飛行」執行原任務。",
            179: "若上傳鏈路斷訊且無法恢復，標準的失效保護機制（Fail Safe）會自動觸發「自動返航」或降落機制以策安全。",
            180: "發生上傳斷訊時，操作人應先冷靜「分析失效原因」，判斷是地形遮蔽干擾、地面站故障，還是機載接收端異常。",
            181: "若判斷是遭遇干擾或地形遮蔽，應檢視地圖介面，等待航機依慣性或自動保護機制脫離遮蔽區恢復控制後，「立即轉向或爬升脫離」。",
            182: "若是地面導控站（發射端）軟硬體異常，應嘗試檢查接線、更換模組或重新開機，嘗試恢復控制。",
            183: "多旋翼在視距外因遮蔽斷訊，同樣應利用地圖或影像檢視干擾源，待恢復連線後「立即轉向或爬升升高」脫離干擾區。",
            184: "若確定是機載接收端異常（代表無法再發送指令），只能利用地面站地圖與即時下傳資訊，「全程監控航機是否正確執行自動返航」並降落。",
            185: "視距內遭地形干擾斷訊，操作人應直接以「肉眼」檢視四周障礙物，待恢復控制後立即爬升脫離遮蔽。",
            186: "下傳鏈路（影像/遙測）失效代表您看不到飛機狀態，應參考斷訊前的最後軌跡與影像，儘速操作遙控器「轉向或爬升」脫離干擾區。",
            187: "下傳失效但上傳（遙控）仍有效時，應依據最後已知資訊，憑經驗推桿執行「轉向或爬升」以脫離遮蔽干擾區域。",
            188: "若是單純下傳斷訊，應立即切換模式或主動觸發「啟動返航模式」，讓飛機自動飛回您可見的區域。",
            189: "若研判是機上的發射端故障（永遠無法傳回影像），應採取減災決策，嘗試以第一人稱或切入自動返航，穩定將飛機降落。",
            190: "若是地面站的接收天線或設備異常，應「立即檢診電源、天線與接頭」，必要時重開機嘗試恢復下傳畫面。",
            191: "視距內發生下傳斷訊（螢幕黑掉），應立即「全程與航機保持肉眼目視」，改以純手動或啟動返航控制航機安全降落。",
            192: "若超過最大合理滯空時間（電池早該沒電了），飛機仍未返航也未見蹤影，代表極可能「已在下傳斷訊時或返航途中墜毀（失事）」。",
            193: "衛星定位（GPS）異常會導致無人機亂飄，應「立即切換至姿態（ATTI）或手動模式」停止 GPS 介入，由操作手接管控制。",
            194: "視距內 GPS 異常，應立刻手動操控航機「爬升脫離」高樓、橋梁等容易遮蔽或反射訊號的環境，並以目視返場。",
            195: "多旋翼 GPS 異常的處理原則相同，皆是手動接管後「轉向或上升脫離」複雜地障環境，待訊號恢復或直接返航。",
            196: "GPS 異常時，飛控無法自動定點，此時「若異常狀況持續無法改正，應儘速以目視方式控制航機返場降落」才是正確作法（不可繼續飛行）。",
            197: "視距內多旋翼 GPS 異常，標準動作：切換姿態模式（關閉GPS介入），改由操作人「目視手動接管」。",
            198: "姿態儀（IMU）異常會導致飛控無法判斷水平，應「切換至適當模式，由操作人目視手動接管」，穩定姿態後降落。",
            199: "視距外姿態儀異常是非常危險的，若手動技術不足，應立刻採取減災決策，「嘗試將航機飛至無人的安全區域實施異地迫降」。",
            200: "視距內姿態儀異常，應立即由操作手「純目視接手操控」，先努力穩定姿態或原處懸停，再緩慢返場。",
            201: "視距外姿態儀異常，應利用酬載影像嘗試「穩定姿態或原處懸停」，同時操控航機與地形障礙物保持安全隔離準備迫降。",
            202: "姿態儀提供飛控核心水平數據，若其異常，應「切換至適當模式停止其錯誤介入，並由操作人完全手動接手」。",
            203: "空速管是定翼機測量速度的重要設備，若失效，應「改以 GPS 等導航系統提供的地速與高度參數」作為飛行的備用參考準據。",
            204: "若單邊控制面失效（如一邊副翼卡死），飛機仍有部分控制力，應嘗試「利用剩餘的正常操縱面及馬達差異推力」來補償並改正姿態。",
            205: "視距外發生單邊翼面失效，應立即以「第一人稱（FPV）方式接手」，嘗試用剩餘舵面配平補償姿態，小心飛回。",
            206: "雙邊控制面失效代表飛機「完全喪失可控性」並將墜毀，應「立即記錄最終定位座標」，待墜毀後前往查看以防引發火災。",
            207: "定翼機發生空中失速，是因為攻角過大。處置原則是立刻接手操控，「推桿（壓低機頭）降低飛行攻角，以建立安全空速」恢復升力。",
            208: "視距內失速處理原則相同：立即切換至手動模式，「推桿壓低機頭降低攻角」，讓飛機俯衝加速以重新建立安全空速。",
            209: "發生低油量/電量警報，首要動作是「立即關閉航機除酬載影像外之非必要酬載設備（如感測器、探照燈）」，以減緩耗電。",
            210: "多旋翼視距外遇低電量，若預估無法飛回本場，應「參考姿態儀及影像，就近尋找安全區域實施異地迫降」，以免半途墜毀砸傷人。",
            211: "低電量時應關閉非必要設備，但維持廣播設備及投放伺服機等模組運作是錯誤的，這些也是耗電設備，非迫降必要應一併關閉。",
            212: "迫降航線處置指的是，當飛機發生緊急狀況但尚能控制時，「自行判斷當下高度、距離與周遭航線，規劃一條安全返場的降落路線」。",
            213: "異地迫降處置指的是，若無法飛回原起降場，必須「參考酬載影像尋找避開人車的平坦處，迫降於安全的非預定地點」。",
            214: "空中緊急避障處置指的是，飛行途中突遇障礙物或他機，必須「機動改變原定任務航線，進行繞越或避讓」。",
            215: "臺北近場臺負責北部與中部空域，範圍最南至彰化，並不包含南部的「雲林縣」（雲林屬高雄近場臺範圍）。",
            216: "高雄近場臺負責南部空域，範圍最北至雲林，並不包含中部的「南投縣」（南投屬臺北近場臺範圍）。",
            217: "RCR45~47 為核三、核一、核二廠的限航區，這類核能設施劃設限航區主要是考量「輻射安全及廠房遭受撞擊的安全」。",
            218: "東沙群島位於南海，其所在的飛航情報區屬於「香港飛航情報區」。",
            219: "南沙群島（太平島）位於南海更南端，其所在的飛航情報區屬於「馬尼拉飛航情報區」。",
            220: "台中屬於中北部空域，若需派員協調航管，必須前往負責該區域的「臺北近場管制塔臺（實際位置在桃園）」。",
            221: "台東屬於南部/東南部空域，若需航管協調，必須派員前往負責該區域的「高雄近場管制塔臺（位置在高雄）」。",
            222: "若活動範圍不在紅黃區、也不超過 400 呎（屬於絕對安全的綠區），則「無需派員至航管單位進行協調」。",
            223: "近場臺屬於國家重要保安管制區，臨時進出人員必須經過「航空警察單位」核准換證始得進入。",
            224: "為了避免溝通混亂與人力浪費，每個申請案原則上只須派遣「1位」協調人員至航管單位即可。",
            225: "若 1 人負責多案，必須錯開作業時間，否則會發生「延誤升空、壓縮時間、甚至無法專心依航管指示落地」等飛安風險（以上皆是）。",
            226: "協調人員主要是建立航管與飛機的溝通橋樑，不需負責「機場周邊活動或其他航機飛行」這類塔台管制員的工作。",
            227: "協調人員抵達航管單位後，應第一時間主動向值班的「航管班務督導」報到並告知作業資訊。",
            228: "航管單位內部需保持高度專注與安靜，故協調人員的手機必須設定為「靜音或震動模式」。",
            229: "航管單位涉國家機密與飛安，作業期間「禁止拍照、錄音、攝影，且不得進入指定區域以外之場所」。",
            230: "空域使用的最高優先權永遠是載人的「軍、民航機」，無人機必須無條件避讓。",
            231: "協調人員接收到航管指示（如要求立即降落）時，應立即聯絡現場的「遙控無人機操作人」配合執行。",
            232: "飛航申請的「作業概述」中，必須清楚敘明「作業目的」與「預計起降地點」，供局方評估風險。",
            233: "預計起降地點可以輸入準確的「經緯度座標」，或是明確可辨識的「地標（如台大實驗林）」，兩者皆可。",
            234: "遙控無人機若發生重大飛航事故，其相關的通報與調查適用國家最高調查機關運安會主管的「運輸事故調查法」。",
            235: "依據運輸事故調查法，發生符合定義之無人機事故時，「除向民航局通報外，亦應向運安會（國家運輸安全調查委員會）通報」。",
            236: "運輸事故發生後，依法必須在得知消息後「2 小時內」通報運安會，時效要求極高。",
            237: "即便是「疑似」發生運輸事故，也同樣必須在得知消息後的「24 小時內」通報運安會（注意與確定的2小時區分）。",
            238: "無正當理由隱匿或未依限通報運安會，將面臨高額的「新臺幣 6 萬元以上 30 萬元以下」行政罰鍰。",
            239: "針對無人機的調查處理細節，明訂於運安會發布的「遙控無人機重大飛航事故調查作業處理規則」中。",
            240: "重大飛航事故發生後，無人機的「所有人、操作人以及相關政府機關」都有義務儘速通報已知狀況（以上皆是）。",
            241: "通報運安會時，第一時間應將已知狀況通報給運安會24小時值班的「值日官」。",
            242: "只要無人機活動造成「人員死亡或傷害」，不論機型大小，一律列為應通報的重大飛航事故。",
            243: "法規定義的「死亡」，是指受到無人機撞擊或割傷後，「當場死亡」或在受傷後一定時間內不治的情形。",
            244: "法規定義的「傷害」，是指受傷後「7 日之內須住院治療 48 小時以上」的嚴重傷害（非一般輕微擦傷）。",
            245: "除了死傷，若「最大起飛重量逾 25 公斤」的大型無人機遭受實質損害（如墜毀），也必須通報運安會。",
            246: "「實質損害」在法規上的嚴格定義，是指航機結構嚴重破壞，導致「遙控無人機損壞無法修復」的報廢狀態。",
            247: "若無人機失控砸毀民宅或車輛，造成財產重大影響，或「毀損超過新臺幣 50 萬元」，即構成重大事故須通報。",
            248: "航空氣象與飛航規則中，「高度（Altitude）」專指自「平均海平面」至空中某點的垂直距離（即海拔高度）。",
            249: "「實際高度（Height）」專指自正下方「特定基準（即當地地面或水面）」至空中某點的垂直距離（AGL）。",
            250: "有人機（載人飛機）的目視飛航，其最低安全實際高度規定為「不得低於距地面或水面 500 呎」，以防與 400 呎以下的無人機相撞。",
            251: "「指示高度」是指儀表板高度表直接顯示的高度，其基準面是「高度表壓力調撥值所設定的基準面」。",
            252: "測量指示高度時，壓力調撥值必須設定為「當地之大氣壓力值（QNH）」，才能準確反映飛機相對當地的實際狀況。",
            253: "「真高度（True Altitude）」即為我們常說的海拔高度，是航空器高於「平均海平面（MSL）」的真實垂直距離。",
            254: "在航空地圖（航圖）上標示的機場標高、山峰高度或高塔障礙物高度，統一都是採用「MSL（平均海平面高度）」。",
            255: "「絕對高度（Absolute Altitude）」是指飛機距離正下方地表的真實距離，通常經由發射電波測距的「電波/雷達高度表」測得。",
            256: "絕對高度（AGL）的測量基準就是飛機正下方的「地面（或水面）」。",
            257: "絕對高度是雷達直接測量物理距離，與大氣壓力無關，故「絕對高度沒有壓力調撥值問題」。",
            258: "絕對高度的通用英文縮寫為「AGL (Above Ground Level)」。",
            259: "飛越或降落高山崎嶇地區時，地形起伏巨大，使用雷達測量的「絕對高度（AGL）」最能確保不會撞山，最為安全。",
            260: "「壓力高度（Pressure Altitude）」是指當氣壓計設定在標準大氣壓（29.92 in-Hg）時所顯示的高度，其基準面為理論的「標準參考面」。",

        function vibrate(pattern) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        function initSettings() {
            const savedSettings = localStorage.getItem('drone_exam_settings');
            if (savedSettings) {
                try {
                    const parsed = JSON.parse(savedSettings);
                    currentTheme = parsed.theme || 'dark';
                    currentSize = parsed.size || 'normal';
                    isPracticeMode = parsed.practice === true;
                } catch(e) {}
            }
            applySettings();
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
            updateSettingsUI();
        }

        function setTextSize(size) {
            currentSize = size;
            applySettings();
            saveSettings();
        }

        function setTheme(theme) {
            currentTheme = theme;
            applySettings();
            saveSettings();
        }

        function setMode(mode) {
            isPracticeMode = (mode === 'practice');
            vibrate(50);
            updateSettingsUI();
            saveSettings();
        }

        function applySettings() {
            document.body.className = `min-h-screen text-slate-300 pb-40 antialiased transition-colors duration-300 theme-${currentTheme} zoom-${currentSize}`;
            if(currentTheme === 'dark') document.body.classList.add('bg-[#0F172A]');
            updateSettingsUI();
        }

            // 清除按鈕選取狀態
            ['normal', 'large', 'xl'].forEach(s => document.getElementById('btn-size-'+s).classList.remove('ring-4', 'ring-blue-500/50', 'border-blue-400'));
            ['dark', 'warm', 'light'].forEach(t => document.getElementById('btn-theme-'+t).classList.remove('ring-4', 'ring-blue-500/50', 'border-blue-400'));
            ['exam', 'practice'].forEach(m => document.getElementById('btn-mode-'+m).classList.remove('ring-4', 'ring-blue-500/50', 'border-blue-400'));
            
            // 加上當前選取狀態

            const isQuizActive = !document.getElementById('quiz-screen').classList.contains('hidden');

            const btnModePractice = document.getElementById('btn-mode-practice');
            const modeWarning = document.getElementById('mode-warning');

                btnModePractice.disabled = true;
                btnModeExam.classList.add('opacity-40', 'cursor-not-allowed');

                if(modeWarning) modeWarning.classList.add('hidden');

        }

            const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY_WRONG);

            if (savedUnseen) {
                try {
                    unseenPool = JSON.parse(savedUnseen);

                    historyWrongPool = savedHistory ? JSON.parse(savedHistory) : [];
                } catch(e) {
                    generateFreshPool();
                }
            } else {
                generateFreshPool();
            }
            updateDashboard();
        }

            unseenPool = Array.from({length: fullBank.length}, (_, i) => i);

            wrongPool = [];
            historyWrongPool = [];
            savePool();
        }

            localStorage.setItem(STORAGE_KEY_HISTORY_WRONG, JSON.stringify(historyWrongPool));
            updateDashboard();
        }

            if (historyWrongPool.length > 0) {
                btnHistory.classList.remove('hidden');
                btnHistory.innerHTML = `<span>📝 歷史易錯題大補帖 (共 ${historyWrongPool.length} 題)</span><span class="text-xs sm:text-sm font-normal text-purple-200 mt-1">針對您曾經錯過的題目進行重點考前衝刺</span>`;
            } else {
                btnHistory.classList.add('hidden');
            }

            // 檢查是否有未完成的測驗存檔
            const savedProgress = localStorage.getItem(STORAGE_KEY_PROGRESS);
            const btnResume = document.getElementById('btn-resume');
            if (savedProgress) {
                try {
                    const parsed = JSON.parse(savedProgress);
                    if (parsed.quiz && parsed.answers) {
                        btnResume.classList.remove('hidden');
                        btnResume.innerHTML = `<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>🔄 繼續上次未完成的測驗 (第 ${parsed.cur + 1} 題)`;
                    } else {
                        btnResume.classList.add('hidden');
                    }
                } catch(e) { btnResume.classList.add('hidden'); }
            } else {
                btnResume.classList.add('hidden');
            }

            // 👑 總冠軍彩蛋判斷與呈現
            const btnSmart = document.getElementById('btn-smart');
            if (masteredCount === fullBank.length) {
                // 套用黃金閃耀樣式
                btnSmart.className = "w-full gold-shimmer hover:brightness-110 transition-all text-white py-4 sm:py-5 rounded-2xl font-bold text-lg sm:text-xl shadow-lg shadow-yellow-500/30 flex flex-col items-center justify-center transform hover:scale-[1.02]";
                btnSmart.innerHTML = `<span class="flex items-center text-2xl drop-shadow-md">🏆 您已精通全部 324 題！</span><span class="text-sm font-medium text-yellow-50 mt-1 opacity-90">點此重置進度並重新開始</span>`;
                btnSmart.onclick = resetProgress;
                
                // 播放彩帶特效
                if (!hasCelebrated) {
                    playChampionshipConfetti();
                    hasCelebrated = true;
                }
            } else {
                hasCelebrated = false; // 被重置時恢復可播放狀態
                btnSmart.className = "w-full bg-blue-600 hover:bg-blue-700 transition-colors text-white py-4 sm:py-5 rounded-2xl font-bold text-lg sm:text-xl shadow-lg shadow-blue-500/20 flex flex-col items-center justify-center transform hover:scale-[1.02]";
                
                // 動態判斷當前模式圖示與文案
                const modeIcon = isPracticeMode ? '🧠' : '⏱️';
                const modeTitle = isPracticeMode ? '開始智慧練習' : '開始智慧測驗';
                const modeSub = isPracticeMode ? '即時解析，' : '限時挑戰，';
                
                btnSmart.innerHTML = `<span>${modeIcon} ${modeTitle} (共 50 題)</span><span class="text-xs sm:text-sm font-normal text-blue-200 mt-1">${modeSub}優先複習「待加強」並補齊「未作答」</span>`;
                
                btnSmart.onclick = () => startQuiz('smart');
            }
        }

        function playChampionshipConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }
        
        // 自動存檔功能
        function saveCurrentProgress() {
            const state = {
                quiz: currentQuiz,
                answers: answers,
                cur: cur,
                timeLeft: timeLeft,
                mode: isPracticeMode
            };
            localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(state));
        }

        // 恢復上次測驗
        function resumeQuiz() {
            const savedProgress = localStorage.getItem(STORAGE_KEY_PROGRESS);
            if (!savedProgress) return;
            try {
                const parsed = JSON.parse(savedProgress);
                currentQuiz = parsed.quiz;
                answers = parsed.answers;
                cur = parsed.cur;
                timeLeft = parsed.timeLeft || EXAM_TIME;
                
                isPracticeMode = parsed.mode || false; // 強制覆蓋為存檔時的模式
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
                const brandFooter = document.getElementById('brand-footer');
                if (brandFooter) brandFooter.classList.add('hidden');

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                
                isTransitioning = false;
                
                if (!isPracticeMode) {
                    startTimer(timeLeft);
                } else {
                    document.getElementById('timer-text').classList.add('hidden');
                }
                render();
            } catch (e) {
                alert("讀取存檔失敗，請重新開始測驗。");
                localStorage.removeItem(STORAGE_KEY_PROGRESS);
            }
        }

        // 計時器功能
        function startTimer(durationInSeconds) {
            clearInterval(timerInterval);
            timeLeft = durationInSeconds;
            const timerEl = document.getElementById('timer-text');
            timerEl.classList.remove('hidden');
            
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                saveCurrentProgress(); // 每秒微幅更新時間到存檔
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    vibrate([500, 200, 500]); // 震動大警告
                    alert("⏱️ 測驗時間到！系統將為您強制交卷。");
                    finish();
                }
            }, 1000);
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timer-text');
            let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let s = (timeLeft % 60).toString().padStart(2, '0');
            timerEl.innerText = `⏱️ ${m}:${s}`;
            
            // 倒數 5 分鐘變色警告
            if (timeLeft < 300) {
                timerEl.classList.replace('text-orange-300', 'text-red-400');
                timerEl.classList.replace('bg-orange-900/40', 'bg-red-900/40');
                timerEl.classList.replace('border-orange-800/50', 'border-red-800/50');
            }
        }

        function startQuiz(mode) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // 隱藏第一頁的品牌 Footer
            const brandFooter = document.getElementById('brand-footer');
            if (brandFooter) brandFooter.classList.add('hidden');

            let nextQuizIndices = [];

            if (mode === 'retry_current') {
                // 將當前錯題再次重新打亂測驗
                let poolToDraw = currentQuiz.map(q => q.id).sort(() => 0.5 - Math.random());
                nextQuizIndices = poolToDraw;
            } else if (mode === 'wrong_only') {
                let poolToDraw = [...wrongPool].sort(() => 0.5 - Math.random());
                nextQuizIndices = poolToDraw.slice(0, MAX_QUESTIONS_PER_QUIZ);
            } else if (mode === 'history') {
                let poolToDraw = [...historyWrongPool].sort(() => 0.5 - Math.random());
                nextQuizIndices = poolToDraw.slice(0, MAX_QUESTIONS_PER_QUIZ);
            } else {
                let wrongToDraw = [...wrongPool].sort(() => 0.5 - Math.random());
                nextQuizIndices = wrongToDraw.slice(0, MAX_QUESTIONS_PER_QUIZ);
                if (nextQuizIndices.length < MAX_QUESTIONS_PER_QUIZ) {
                    let needed = MAX_QUESTIONS_PER_QUIZ - nextQuizIndices.length;
                    let unseenToDraw = unseenPool.slice(0, needed);
                    nextQuizIndices = nextQuizIndices.concat(unseenToDraw);
                }
            }

            if (nextQuizIndices.length === 0) {
                alert("目前沒有題目可以測驗囉！");
                return;
            }

            nextQuizIndices.sort(() => 0.5 - Math.random());
            currentQuiz = nextQuizIndices.map(id => fullBank[id]);
            answers = new Array(currentQuiz.length).fill(-1);
            cur = 0;
            isTransitioning = false;
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            saveCurrentProgress(); // 開始時立即存檔
            
            if (!isPracticeMode) {
                startTimer(EXAM_TIME);
            } else {
                document.getElementById('timer-text').classList.add('hidden');
            }
            
            render();
        }

        function render() {
            if(!currentQuiz || currentQuiz.length === 0) return;
            if(cur >= currentQuiz.length) { finish(); return; }

            const modeLabel = isPracticeMode ? '🧠 練習' : '⏱️ 測驗';
            document.getElementById('progress-text').innerText = `${modeLabel}：第 ${cur + 1} 題 / 共 ${currentQuiz.length} 題`;
            document.getElementById('progress-bar').style.width = `${((cur + 1) / currentQuiz.length) * 100}%`;
            document.getElementById('question-text').innerText = `${cur + 1}. ${currentQuiz[cur].q}`;

            // 重置練習模式狀態
            document.getElementById('practice-exp').classList.add('hidden');
            document.getElementById('next-action-btn').classList.add('hidden');

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            
            currentQuiz[cur].options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                const isSelected = (answers[cur] === idx);
                
                // 動態切換類別：移除了 hover 特效避免手機卡色
                const defaultClass = "option-btn-default bg-slate-800 border-slate-600 text-slate-200";
                const selectedClass = "bg-blue-600 border-blue-500 text-white shadow-md transform scale-[1.01]";
                
                btn.className = `option-btn w-full p-3 sm:p-5 rounded-xl sm:rounded-2xl text-left border-2 font-bold text-base sm:text-lg transition-transform ${isSelected ? selectedClass : defaultClass}`;
                btn.innerText = opt;
                btn.onclick = () => selectOption(idx);
                optDiv.appendChild(btn);
            });

            // 如果該題已答（在練習模式中按上一題回來看時）
            if (isPracticeMode && answers[cur] !== -1) {
                showPracticeFeedback(answers[cur]);
            }

            const prevBtn = document.getElementById('prev-btn');
            if (cur === 0 || isPracticeMode) { 
                // 練習模式不顯示「上一題修改」，強制往前走
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }
        }

        function selectOption(idx) {
            // 防連點或已答題鎖定
            if (isTransitioning) return; 
            if (isPracticeMode && answers[cur] !== -1) return;
            
            vibrate(50); // 點擊微震動反饋
            isTransitioning = true;
            answers[cur] = idx;
            
            saveCurrentProgress(); // 每次點選都自動存檔
            
            if (isPracticeMode) {
                showPracticeFeedback(idx);
                isTransitioning = false; // 解除鎖定等待使用者按「下一題」
            } else {
                render(); 
                setTimeout(() => {
                    if (cur < currentQuiz.length - 1) {
                        cur++;
                        render();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        finish();
                    }
                    isTransitioning = false;
                }, 300);
            }
        }

        // 練習模式的即時解析反饋
        function showPracticeFeedback(selectedIdx) {
            const btns = document.querySelectorAll('.option-btn');
            const q = currentQuiz[cur];
            const isCorrect = (selectedIdx === q.correct);
            
            // 標示對錯
            btns.forEach((btn, i) => {
                btn.classList.remove('bg-blue-600', 'border-blue-500'); // 移除預設選中藍色
                if (i === q.correct) {
                    btn.classList.add('bg-emerald-600', 'border-emerald-500', 'text-white', 'shadow-md');
                } else if (i === selectedIdx && !isCorrect) {
                    btn.classList.add('bg-red-600', 'border-red-500', 'text-white', 'shadow-md');
                } else {
                    btn.classList.add('opacity-50'); // 黯淡未選取的錯誤選項
                }
            });

            if (!isCorrect) vibrate([50, 100, 50]); // 答錯時震動兩下警告

            // 顯示解析
            if (q.exp) {
                const expDiv = document.getElementById('practice-exp');
                expDiv.innerHTML = `<div class="p-4 bg-blue-900/30 rounded-xl border border-blue-800/50 shadow-sm"><p class="text-blue-200 text-sm sm:text-base leading-relaxed"><span class="font-bold mr-1">💡 解題說明：</span>${q.exp}</p></div>`;
                expDiv.classList.remove('hidden');
            }
            
            // 顯示下一題按鈕
            const nextBtn = document.getElementById('next-action-btn');
            nextBtn.classList.remove('hidden');
            if (cur === currentQuiz.length - 1) {
                nextBtn.innerText = "查看測驗結果 →";
            } else {
                nextBtn.innerText = "下一題 →";
            }
            
            // 稍微往下捲動，確保解析與下一題按鈕都在視野內
            setTimeout(() => {
                document.getElementById('next-action-btn').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextPracticeQuestion() {
            if (cur < currentQuiz.length - 1) {
                cur++;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                finish();
            }
        }

        function prevQuestion() {
            if (cur > 0 && !isTransitioning) {
                cur--;
                render();
                // 換題時自動平滑捲動回上方
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function finish() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            clearInterval(timerInterval); // 停止計時器
            localStorage.removeItem(STORAGE_KEY_PROGRESS); // 清除存檔
            
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let score = 0;
            let reviewHtml = '';
            const pointPerQuestion = 100 / currentQuiz.length;

            currentQuiz.forEach((q, i) => {
                let userAns = answers[i];
                let isCorrect = (userAns === q.correct);
                
                unseenPool = unseenPool.filter(id => id !== q.id);

                if (isCorrect) {
                    score += pointPerQuestion;
                    wrongPool = wrongPool.filter(id => id !== q.id);
                } else {
                    if (!wrongPool.includes(q.id)) {
                        wrongPool.push(q.id);
                    }
                    if (!historyWrongPool.includes(q.id)) {
                        historyWrongPool.push(q.id);
                    }

                    let userStr = userAns === -1 ? '未作答' : q.options[userAns];
                    let correctStr = q.options[q.correct];
                    
                    let expStr = q.exp ? 
                        `<div class="review-exp mt-4 p-4 bg-blue-900/30 rounded-xl border border-blue-800/50 shadow-sm"><p class="text-blue-200 text-sm sm:text-base leading-relaxed"><span class="font-bold mr-1">💡 解題說明：</span>${q.exp}</p></div>` : 
                        ``;
                    
                    reviewHtml += `
                        <div class="review-card bg-slate-800 p-5 sm:p-6 rounded-2xl border border-red-900/50 relative mb-4">
                            <span class="absolute top-4 right-4 text-red-500/50">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path></svg>
                            </span>
                            <p class="font-bold text-slate-100 mb-4 text-lg pr-8">第 ${i+1} 題：${q.q}</p>
                            <div class="space-y-2 mb-2">
                                <p class="text-red-500 font-medium text-sm sm:text-base"><span class="text-slate-400 mr-2">您的答案：</span>${userStr}</p>
                                <p class="text-green-500 font-medium text-sm sm:text-base"><span class="text-slate-400 mr-2">正確答案：</span>${correctStr}</p>
                            </div>
                            ${expStr}
                        </div>
                    `;
                }
            });

            savePool();

            score = Math.round(score);
            document.getElementById('score').innerText = `${score}`;
            
            let passStatus = score >= 80 
                ? '<span class="text-green-400 bg-green-900/30 px-5 py-2 rounded-full border border-green-800/50">🎉 恭喜及格！(答對題目已進入精通區塊)</span>' 
                : '<span class="text-red-400 bg-red-900/30 px-5 py-2 rounded-full border border-red-800/50">❌ 不及格，錯題已為您鎖定至「待加強」區塊。</span>';
            document.getElementById('pass-status').innerHTML = passStatus;

            const reviewContainer = document.getElementById('review');
            const reviewTitle = document.getElementById('review-title');
            
            if(score === 100) {
                reviewTitle.classList.add('hidden');
                reviewContainer.innerHTML = `
                    <div class="text-center bg-green-900/30 text-green-400 font-bold p-8 rounded-2xl border border-green-800/50">
                        <p class="text-2xl mb-2 text-green-300">🏆 滿分全對！</p>
                        <p class="font-normal text-green-400/80">這 ${currentQuiz.length} 題已完全答對並更新為「✅ 已精通」狀態！</p>
                    </div>`;
                
                // 單次回合滿分專屬小彩帶
                try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, zIndex: 100 }); } catch(e) {}
            } else {
                reviewTitle.classList.remove('hidden');
                reviewContainer.innerHTML = reviewHtml;
            }

            const actionButtons = document.getElementById('action-buttons');
            let buttonsHtml = `
                <button onclick="document.getElementById('result-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); document.getElementById('brand-footer').classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' });" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-2xl font-bold text-xl shadow-lg transition-colors flex items-center justify-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    回到主畫面查看進度
                </button>
            `;
            
            // 如果沒考滿分，追加「重測本次錯題」按鈕
            if (score < 100) {
                buttonsHtml += `
                    <button onclick="startQuiz('retry_current')" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold text-xl shadow-lg transition-colors flex items-center justify-center mt-2">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        ↺ 重新測驗本次 50 題 (針對錯題加強)
                    </button>
                `;
            } else {
                // 若滿分，則建議繼續挑戰全新題
                buttonsHtml += `
                    <button onclick="startQuiz('smart')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-xl shadow-lg transition-colors flex items-center justify-center mt-2">
                        <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                        繼續抽取全新題庫挑戰
                    </button>
                `;
            }
            
            actionButtons.innerHTML = buttonsHtml;
        }
        
        // 啟動
        initSettings();
        initPool();
    </script>
</body>
</html>
